                    const commentsData = [{"id":199512,"teacher_id":10268,"teacher_name":"刘益光","post_time":"2024-09-25 01:18:24","like_diff":20,"likes":24,"dislikes":4,"content":"刘老师很幽默，而且是新老师，跟别的老师教学方式还是很不一样的。很关心我们，听力视频有些难辨别发音，他就自己写完了三分钟的翻译，不是很多老师愿意下这种苦功夫吧。整体教学在reading上是循规蹈矩的先跟读再通篇浏览提问题，但是对各方面的拓展很有心了"},{"id":207975,"teacher_id":10268,"teacher_name":"刘益光","post_time":"2024-12-25 06:14:57","like_diff":16,"likes":20,"dislikes":4,"content":"刘老师应该是今年的新老师，讲课很仔细很负责任，会耐心地解释生词，小测前十名会发奖品。唯一不足就是老师的发音不是很好听。"},{"id":202894,"teacher_id":10268,"teacher_name":"刘益光","post_time":"2024-11-15 04:43:03","like_diff":13,"likes":15,"dislikes":2,"content":"很认真负责的老师，10分奉上。\n\n预置刘老师的同学有福了。\n\n上课有幽默感，很年轻有活力，所以也和同学们有共同语言，上课干货很多。大英有quiz和dictation是必然的，但是刘老师上课讲的很到位，所以其实还好。有一次翻到刘老师的主页，震惊了，30岁的博导...这么优秀的青年学者在给我们上课orz"},{"id":202324,"teacher_id":10268,"teacher_name":"刘益光","post_time":"2024-11-11 15:08:42","like_diff":10,"likes":10,"dislikes":0,"content":"玛雅特别好一老师😘新老师特别有活人气息🤩刚开学还不会骑自行车，选课选得特别差通勤时间很紧，给刘老师说前几周没学会自行车都可能会迟到，本来很忐忑老师态度怎样，结果刘老师还让我路上小心走慢一点😍上课也很好循循善诱🥰quiz前十还会送奖品😚人还特别幽默和蔼"},{"id":207922,"teacher_id":10268,"teacher_name":"刘益光","post_time":"2024-12-25 03:25:12","like_diff":10,"likes":11,"dislikes":1,"content":"伟大无需多言。选就完事了。帅哥男神"},{"id":208002,"teacher_id":10268,"teacher_name":"刘益光","post_time":"2024-12-25 07:34:18","like_diff":9,"likes":9,"dislikes":0,"content":"超好的老师，quiz和作文都尽可能的给分高，课堂还是很有趣的（因为是年轻老师高强度冲浪），quiz前十和进步的同学还会有奖品，最后一节课也是送了每个同学糖吃。本来补选是抱着什么老师都能接受的心态，结果开盲盒开到宝藏了。"},{"id":209112,"teacher_id":10268,"teacher_name":"刘益光","post_time":"2025-01-04 13:46:38","like_diff":9,"likes":11,"dislikes":2,"content":"特别好！to learn to unlearn to relearn"},{"id":209324,"teacher_id":10268,"teacher_name":"刘益光","post_time":"2025-01-05 12:09:50","like_diff":9,"likes":10,"dislikes":1,"content":"出分前夕来打10分\n大英0分，老师10分\n刘老师教的确实很细很到位\n班里没人挂大英🥰"},{"id":199312,"teacher_id":10268,"teacher_name":"刘益光","post_time":"2024-09-21 01:07:47","like_diff":8,"likes":9,"dislikes":1,"content":"人很好，作业少，效率高，这样的老师哪里找"},{"id":204600,"teac  辜负刘老师了… 一定要珍惜！！！上课认真听就可以！！"},{"id":199326,"teacher_id":10268,"teacher_name":"刘益光","post_time":"2024-09-21 04:49:58","like_diff":2,"likes":3,"dislikes":1,"content":"刘老师很有趣哦！！！"},{"id":199400,"teacher_id":10268,"teacher_name":"刘益光","post_time":"2024-09-23 02:40:54","like_diff":2,"likes":3,"dislikes":1,"content":"老师认真负责，风趣幽默！"},{"id":201515,"teacher_id":10268,"teacher_name":"刘益光","post_time":"2024-11-04 04:15:34","like_diff":2,"likes":3,"dislikes":1,"content":"好好好"},{"id":217752,"teacher_id":10268,"teacher_name":"刘益光","post_time":"2025-04-16 03:04:42","like_diff":2,"likes":3,"dislikes":1,"content":"特别特别好，有趣，有新意，答不上来也会给台阶下，对同学特别好"},{"id":220014,"teacher_id":10268,"teacher_name":"刘益光","post_time":"2025-06-13 13:17:44","like_diff":2,"likes":3,"dislikes":1,"content":"想不出不给刘老师满分的理由 刘老师特别特别好！上大英四收获满满的一个学期，刘老师专业水准高，而且很有自己的视野和视角，可以说是真正的英语课堂。而且刘老师人也很好 总之是满分10分肯定要给20分的程度"},{"id":225942,"teacher_id":10268,"teacher_name":"刘益光","post_time":"2026-01-05 08:13:42","like_diff":1,"likes":3,"dislikes":2,"content":"力推力推！人很有魅力！"},{"id":226298,"teacher_id":10268,"teacher_name":"刘益光","post_time":"2026-01-10 16:10:51","like_diff":1,"likes":1,"dislikes":0,"content":"特别好，力推，大英4直接来。"},{"id":217807,"teacher_id":10268,"teacher_name":"刘益光","post_time":"2025-04-16 22:08:42","like_diff":0,"likes":1,"dislikes":1,"content":"好好好"},{"id":223688,"teacher_id":10268,"teacher_name":"刘益光","post_time":"2025-10-13 09:52:09","like_diff":0,"likes":1,"dislikes":1,"content":"满昏满昏，除了“我们的校歌有一句叫做海纳百川（doge”"},{"id":223746,"teacher_id":10268,"teacher_name":"刘益光","post_time":"2025-10-16 09:14:42","like_diff":0,"likes":6,"dislikes":6,"content":"正在上25-26秋冬新开的翻译与人工智能前沿，真是极具欺骗性名不副实的一门课啊（。五周过去了听懂了0个字😇非常非常令人困惑，听下来甚至不知道他要让我们做什么、期末想看到什么内容......他已经沉浸在大谈特谈自己的研究领域之中无法自拔了。感觉有成为何文忠二代目（贬义）的潜质👍"},{"id":226012,"teacher_id":10268,"teacher_name":"刘益光","post_time":"2026-01-06 12:44:19","like_diff":0,"likes":2,"dislikes":2,"content":"上的课是刘老师的翻译与人工智能，好像是这学期新开的课，进去之前以为是一个以英语学习为主的课程，听了几节课才发现主要和人工智能使用有关\n\n老师人很好，非常温柔体贴，还给我们送了书，有一节课给我们带了蛋糕吃，平时问他的问题也都会很耐心的回答，请过一次病假，老师也专门私信来提醒作业相关问题，总体来说老师人特别好\n\n这节课应该有很多都是翻译本专业的同学来上，我自己是外专业的，但是感觉听课过程也不是很艰难，老师ppt做得很详尽，讲解也很细致，作业要求什么的都给的很全面，不会像一些老师模糊不清\n\n课程本身除了中间有几节课突然出现了一些敲代码环节之外其他都挺好的，敲代码环节也不是真的敲代码，感觉就是模仿助教就行，这块听不太懂也看不太懂但是好像对课程后期也没什么大影响\n\n成绩包括平时作业、一篇论文展示和最后的课程论文，平时作业挺好玩的，自己翻译水平比较差看那些ai译文和标准答案什么的觉得很高端，论文展示就是正常的pre，老师人很好为我补充了很多相关内容，课程论文还没写，截止日期也非常友好不用担心影响考试，可以考试周结束再开始"},{"id":226308,"teacher_id":10268,"teacher_name":"刘益光","post_time":"2026-01-11 02:05:02","like_diff":0,"likes":0,"dislikes":0,"content":"伟大无需多言，没考过前十也有棒棒糖吃。大英四的课程设置决定了这门课不会太有意思，但刘老师的课会有不少梗（bushi），还有很多人生道理。还有就是不要认为大英四和高中英语一个难度，单词是要背的！！！背了就有分/手动狗头"}];
                    
                    // 排序函数
                    function sortComments(sortType) {
                        let sortedComments = [...commentsData];
                        
                        if (sortType === 'popular') {
                            // 按人气排序（点赞减点踩）
                            sortedComments.sort((a, b) => b.like_diff - a.like_diff);
                        } else if (sortType === 'latest') {
                            // 按时间排序（最新在前）
                            sortedComments.sort((a, b) => new Date(b.post_time) - new Date(a.post_time));
                        }
                        
                        return sortedComments;
                    }
                    
                    // 渲染评论列表
                    function renderComments(comments) {
                        const commentsList = document.getElementById('comments-list');
                        commentsList.innerHTML = comments.map(comment => `
                            <div class="comment-item">
                                <div class="comment-meta">
                                    <span class="comment-time">${comment.post_time}</span>
                                    <span class="comment-likes">
                                        <span class="likes"><i class="fas fa-thumbs-up"></i> ${comment.likes}</span>
                                        <span class="dislikes"><i class="fas fa-thumbs-down"></i> ${comment.dislikes}</span>
                                    </span>
                                </div>
                                <div class="comment-content">${comment.content}</div>
                            </div>
                        `).join('');
                    }
                    
                    // 初始化页面
                    document.addEventListener('DOMContentLoaded', function() {
                        // 默认显示人气评论
                        renderComments(sortComments('popular'));
                        
                        // 绑定排序按钮事件
                        document.querySelectorAll('.sort-btn').forEach(btn => {
                            btn.addEventListener('click', function() {
                                // 更新按钮状态
                                document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
                                this.classList.add('active');
                                
                                // 排序并渲染评论
                                const sortType = this.getAttribute('data-sort');
                                renderComments(sortComments(sortType));
                            });
                        });
                    });
                </script>
            </div>

    <script>
        // 搜索功能
        document.addEventListener('DOMContentLoaded', function() {
            const searchInput = document.getElementById('search-input');
            const searchBtn = document.getElementById('search-btn');
            
            // 搜索按钮点击事件
            if (searchBtn) {
                searchBtn.addEventListener('click', function() {
                    performSearch();
                });
            }
            
            // 搜索框回车事件
            if (searchInput) {
                searchInput.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') {
                        performSearch();
                    }
                });
            }
            
            function performSearch() {
                const query = searchInput.value.trim();
                if (query) {
                    // 跳转到首页并携带搜索参数
                    window.location.href = '../index.html?search=' + encodeURIComponent(query);
                } else {
                    // 如果搜索为空，只跳转到首页
                    window.location.href = '../index.html';
                }
            }
        });
    </script>
