35,"teacher_id":2764,"teacher_name":"邵建忠","post_time":"2023-03-07 10:53:18","like_diff":0,"likes":2,"dislikes":2,"content":"谢谢老师不挂之恩"},{"id":208695,"teacher_id":2764,"teacher_name":"邵建忠","post_time":"2024-12-31 05:18:36","like_diff":0,"likes":0,"dislikes":0,"content":"单从应试的角度来讲老师讲的课一点用都没有。。。。重点弥散上课前根本不知道哪些要考哪些是了解。。非重点讲太多了，笔记记完到复习课的时候一看里面记的全是史"},{"id":208824,"teacher_id":2764,"teacher_name":"邵建忠","post_time":"2025-01-02 09:19:44","like_diff":0,"likes":0,"dislikes":0,"content":"好老师，非常非常好的老师。"},{"id":213415,"teacher_id":2764,"teacher_name":"邵建忠","post_time":"2025-01-17 08:50:35","like_diff":0,"likes":0,"dislikes":0,"content":"老师特别慈祥，上课讲的也比较清楚，病毒学就一篇论文考试周最后一天交就行。这学期病毒学有两次纸质签到，提醒一下后来的同学们~"},{"id":224242,"teacher_id":2764,"teacher_name":"邵建忠","post_time":"2025-11-13 06:44:21","like_diff":0,"likes":0,"dislikes":0,"content":"超级好"},{"id":91605,"teacher_id":2764,"teacher_name":"邵建忠","post_time":"2018-12-15 10:23:17","like_diff":-4,"likes":12,"dislikes":16,"content":"辣鸡 占用课外时间展示 让我元旦不能回家"},{"id":66774,"teacher_id":2764,"teacher_name":"邵建忠","post_time":"2018-01-19 03:40:15","like_diff":-14,"likes":1,"dislikes":15,"content":"三个字"},{"id":98340,"teacher_id":2764,"teacher_name":"邵建忠","post_time":"2019-01-23 10:43:10","like_diff":-17,"likes":9,"dislikes":26,"content":"上课迷的不行，总是以一个高层的思维看待苦逼的学生，堪称嘴强王者"}];
                    
                    // 排序函数
                    function sortComments(sortType) {
                        let sortedComments = [...commentsData];
                        
                        if (sortType === 'popular') {
                            // 按人气排序（点赞减点踩）
                            sortedComments.sort((a, b) => b.like_diff - a.like_diff);
                        } else if (sortType === 'latest') {
                            // 按时间排序（最新在前）
                            sortedComments.sort((a, b) => new Date(b.post_time) - new Date(a.post_time));
                        }
                        
                        return sortedComments;
                    }
                    
                    // 渲染评论列表
                    function renderComments(comments) {
                        const commentsList = document.getElementById('comments-list');
                        commentsList.innerHTML = comments.map(comment => `

                                    <span class="comment-likes">

                                        <span class="dislikes"><i class="fas fa-thumbs-down"></i> ${comment.dislikes}</span>
                                    </span>
                                </div>
                                <div class="comment-content">${comment.content}</div>
                            </div>
                        `).join('');
                    }
                    
                    // 初始化页面
                    document.addEventListener('DOMContentLoaded', function() {
                        // 默认显示人气评论
                        renderComments(sortComments('popular'));
                        
                        // 绑定排序按钮事件

                                // 更新按钮状态
                                document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
                                this.classList.add('active');
                                
                                // 排序并渲染评论
                                const sortType = this.getAttribute('data-sort');
                                renderComments(sortComments(sortType));
                            });
                        });
                    });
                </script>

    <script>

        document.addEventListener('DOMContentLoaded', function() {
            const searchInput = document.getElementById('search-input');
            const searchBtn = document.getElementById('search-btn');
            
            // 搜索按钮点击事件
            if (searchBtn) {
                searchBtn.addEventListener('click', function() {
                    performSearch();
                });
            }
            
            // 搜索框回车事件
            if (searchInput) {
                searchInput.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') {
                        performSearch();
                    }
                });
            }
            
            function performSearch() {
                const query = searchInput.value.trim();
                if (query) {
                    // 跳转到首页并携带搜索参数
                    window.location.href = '../index.html?search=' + encodeURIComponent(query);
                } else {
                    // 如果搜索为空，只跳转到首页
                    window.location.href = '../index.html';
                }
            }
        });
    </script>
