                <script>
                    // 评论数据
                    const commentsData = [{"id":191084,"teacher_id":1337,"teacher_name":"谢立","post_time":"2024-04-01 16:06:11","like_diff":9,"likes":10,"dislikes":1,"content":"但凡有点机器学习基础的，或者做过几个机器学习项目的，你的水平就会超过讲课的谢立大神哦~"},{"id":219974,"teacher_id":1337,"teacher_name":"谢立","post_time":"2025-06-13 02:29:46","like_diff":6,"likes":6,"dislikes":0,"content":"从来没上过这么差的课，从来没见过这样的老师，如果他是生仪学院的老师，我对你院水平感到困惑。我觉得有个评论说的很好，但凡有一点了解都比谢立懂得多。\n\n平时上课是念ppt的，念到哪扯点别的，我想请问你自己知道自己在讲什么吗。作为一门专业课，知识全是大白话。理论计算类的但凡难一点我怕谢老师自己都看不懂，也无怪乎考试计算题就定死的那三道。\n\n哦如果你觉得很水选这门课，那不好意思，如果你能接受三次小实验，一次大实验。很少吗？确实不多，但也决不那么水。\n\n如果你是奔着考试简单去的，刚考完试，如何评价呢。两小时卷子，35道填空10道判断，确实是ppt上，但经过了谢大神自我的句式改编，500页ppt是根本来不及翻的，加上计算题感觉整个教室是没几个人写完的。我承认确实复习压力小。但是这张卷子足以反映出谢立贫瘠的知识，低劣的水平。这张试卷让小学生考和我考其实没有本质区别。我认为我做这张卷子被侮辱了。我上过计院的很多课，很多被称为shi的课，我真心认为比你院开的水平好一百倍。"},{"id":26787,"teacher_id":1337,"teacher_name":"谢立","post_time":"2016-06-21 06:13:13","like_diff":5,"likes":5,"dislikes":0,"content":"谢立大神讲得太烂了，强行变成通识课。"},{"id":194956,"teacher_id":1337,"teacher_name":"谢立","post_time":"2024-06-26 05:11:10","like_diff":5,"likes":5,"dislikes":0,"content":"酷酷的"},{"id":21798,"teacher_id":1337,"teacher_name":"谢立","post_time":"2016-03-01 06:28:50","like_diff":3,"likes":3,"dislikes":0,"content":"玄之玄学"},{"id":196834,"teacher_id":1337,"teacher_name":"谢立","post_time":"2024-07-05 11:30:41","like_diff":3,"likes":9,"dislikes":6,"content":"智能信息处理\n\n仪器方向少有的大水课\n\n实验课纸质签到，理论课人少的时候会抽点，24春夏点过两次名。\n\n平时只有3次小实验+1个大作业，事非常少。\n\n上课不用听，开卷考试打印PPT进考场框框翻就完事了，题目全是PPT上原话，最后给分很好。\n\n可以说是生仪大三下最轻松的一门课了。\n\n建议想水选修课学分的，无脑选；想学知识的，快逃。\n\n最后评下老师个人，谢立人还是挺好的，就是太唐了点，还不会讲课"},{"id":198142,"teacher_id":1337,"teacher_name":"谢立","post_time":"2024-09-02 13:34:45","like_diff":3,"likes":3,"dislikes":0,"content":"首页--版面列表--信电ISEE--用一句话来证明你上过谢立大神的课\n\n\n\n用一句话来证明你上过谢立大神的课\n\n2012-03-06 23:15:07\n\n\n\n以下是引用阿屋在3/7/2012 8:11:26 AM的发言：\n\n我是不是太抽象了\n\n\n\n另外谢立大神是个老梗，这里的大神是跳大神的大神，不是一般的大神"},{"id":219975,"teacher_id":1337,"teacher_name":"谢立","post_time":"2025-06-13 02:41:28","like_diff":3,"likes":3,"dislikes":0,"content":"无话可说，考试请辛顿或者“乐村”这样的大神上身都没用了，必须请谢立大神这尊人工智能领域大神才行。"},{"id":220010,"teacher_id":1337,"teacher_name":"谢立","post_time":"2025-06-25 13:08:22","like_diff":3,"likes":3,"dislikes":0,"content":"谢立老师特色课程\n\n简称谢特课程\n\n另外楼下说水课那个，现在已经严重误人子弟了\n\n6.17：各位同学，我周末出分。\n\n今天：各位同学，我已经按照学校的要求提交了成绩，你们如果觉得对自己的成绩不满意，那一定不是我的原因，很可能是因为你周围的同学太优秀。"},{"id":221150,"teacher_id":1337,"teacher_name":"谢立","post_time":"2025-06-21 13:39:26","like_diff":3,"likes":3,"dislikes":0,"content":"哈哈哈，你们完蛋啦！我要把点名单交给教务处老师！！！"},{"id":30633,"teacher_id":1337,"teacher_name":"谢立","post_time":"2016-07-02 05:58:13","like_diff":2,"likes":3,"dislikes":1,"content":"服气。。。。。上课不讲重点，考试还乱考，全自学，考试开卷不考重点，净挑些边角来考你翻书能力"},{"id":221451,"teacher_id":1337,"teacher_name":"谢立","post_time":"2025-06-23 16:04:31","like_diff":2,"likes":2,"dislikes":0,"content":"真的太奇怪了，和他聊了几句成绩的事，感觉情商是负的，我完全不知道他想干什么，说一些话到底出于什么目的，是想看别人破防吗，不过我本来就已经保不了研了，不是很在乎分数\n\n至于课也挺也一般的，签到+三次小实验+一次大实验+期末。讲的非常一般，实验部分倒是还行（但我觉得助教的功劳很大），期末更是逆天中的逆天，这种试卷时给人做的啊"},{"id":222535,"teacher_id":1337,"teacher_name":"谢立","post_time":"2025-07-11 08:24:04","like_diff":2,"likes":2,"dislikes":0,"content":"大傻逼"},{"id":170685,"teacher_id":1337,"teacher_name":"谢立","post_time":"2023-03-08 06:56:18","like_diff":1,"likes":3,"dislikes":2,"content":"测试智能信息处理，生医工数字仪器选修课\n\n理论课极水，都在讲概念，学不到东西，没有作业\n\n实验课直接让你在网上查代码跑\n\n大作业三人一组，内容不限\n\n考试开卷，打印ppt进去翻书即可，不用听课\n\n——————\n\n事非常少，给分不错。但是啥也学不到，混点学分可以的。"},{"id":20094,"teacher_id":1337,"teacher_name":"谢立","post_time":"2016-01-26 05:25:56","like_diff":0,"likes":1,"dislikes":1,"content":"讲的真不怎么样，挺水的，但是给分还行，考试不难"},{"id":190238,"teacher_id":1337,"teacher_name":"谢立","post_time":"2024-02-26 09:26:53","like_diff":0,"likes":0,"dislikes":0,"content":"555"},{"id":221724,"teacher_id":1337,"teacher_name":"谢立","post_time":"2025-06-25 13:22:38","like_diff":0,"likes":0,"dislikes":0,"content":"大三短学期了怎么谢立还来作妖了？又开始哔哔它那个软著，什么玩意啊这是\n\n另外感觉今天谢立的四肢姿态真的有种共济失调的美"}];
                    
                    // 排序函数
                    function sortComments(sortType) {
                        let sortedComments = [...commentsData];
                        
                        if (sortType === 'popular') {
                            // 按人气排序（点赞减点踩）
                            sortedComments.sort((a, b) => b.like_diff - a.like_diff);
                        } else if (sortType === 'latest') {
                            // 按时间排序（最新在前）
                            sortedComments.sort((a, b) => new Date(b.post_time) - new Date(a.post_time));
                        }
                        
                        return sortedComments;
                    }
                    
                    // 渲染评论列表
                    function renderComments(comments) {
                        const commentsList = document.getElementById('comments-list');
                        commentsList.innerHTML = comments.map(comment => `
                            <div class="comment-item">
                                <div class="comment-meta">
                                    <span class="comment-time">${comment.post_time}</span>
                                    <span class="comment-likes">
                                        <span class="likes"><i class="fas fa-thumbs-up"></i> ${comment.likes}</span>
                                        <span class="dislikes"><i class="fas fa-thumbs-down"></i> ${comment.dislikes}</span>
                                    </span>
                                </div>
                                <div class="comment-content">${comment.content}</div>
                            </div>
                        `).join('');
                    }
                    
                    // 初始化页面
                    document.addEventListener('DOMContentLoaded', function() {
                        // 默认显示人气评论
                        renderComments(sortComments('popular'));
                        
                        // 绑定排序按钮事件
                        document.querySelectorAll('.sort-btn').forEach(btn => {
                            btn.addEventListener('click', function() {
                                // 更新按钮状态
                                document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
                                this.classList.add('active');
                                
                                // 排序并渲染评论
                                const sortType = this.getAttribute('data-sort');
                                renderComments(sortComments(sortType));
                            });
                        });
                    });
                </script>

    <script>
        // 搜索功能
        document.addEventListener('DOMContentLoaded', function() {
            const searchInput = document.getElementById('search-input');
            const searchBtn = document.getElementById('search-btn');
            
            // 搜索按钮点击事件
            if (searchBtn) {
                searchBtn.addEventListener('click', function() {
                    performSearch();
                });
            }
            
            // 搜索框回车事件
            if (searchInput) {
                searchInput.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') {
                        performSearch();
                    }
                });
            }
            
            function performSearch() {
                const query = searchInput.value.trim();
                if (query) {
                    // 跳转到首页并携带搜索参数
                    window.location.href = '../index.html?search=' + encodeURIComponent(query);
                } else {
                    // 如果搜索为空，只跳转到首页
                    window.location.href = '../index.html';
                }
            }
        });
    </script>
</body>
</html>
