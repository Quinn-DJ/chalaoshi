"2019-07-16 00:38:41","like_diff":0,"likes":1,"dislikes":1,"content":"上课挺清楚的"},{"id":135747,"teacher_id":1002,"teacher_name":"唐敏","post_time":"2021-05-23 05:14:58","like_diff":0,"likes":0,"dislikes":0,"content":"老师挺好的，上课有意思"},{"id":152340,"teacher_id":1002,"teacher_name":"唐敏","post_time":"2022-04-05 11:03:21","like_diff":0,"likes":0,"dislikes":0,"content":"好好好"},{"id":217570,"teacher_id":1002,"teacher_name":"唐敏","post_time":"2025-04-13 13:19:35","like_diff":0,"likes":0,"dislikes":0,"content":"呵呵呵呵"},{"id":221711,"teacher_id":1002,"teacher_name":"唐敏","post_time":"2025-06-25 11:11:52","like_diff":0,"likes":1,"dislikes":1,"content":"上课学不到什么，但是实验质量还可以\n\n\n\n平时实验给分不高，建议bonus全做，不然得分不高。bonus做了就给满，但是平时实验给分普遍低。\n\n\n\n考勤"},{"id":136482,"teacher_id":1002,"teacher_name":"唐敏","post_time":"2021-06-18 13:29:24","like_diff":-1,"likes":0,"dislikes":1,"content":"挺不错的"}];
                    
                    // 排序函数
                    function sortComments(sortType) {
                        let sortedComments = [...commentsData];
                        
                        if (sortType === 'popular') {
                            // 按人气排序（点赞减点踩）
                            sortedComments.sort((a, b) => b.like_diff - a.like_diff);
                        } else if (sortType === 'latest') {
                            // 按时间排序（最新在前）
                            sortedComments.sort((a, b) => new Date(b.post_time) - new Date(a.post_time));
                        }
                        
                        return sortedComments;
                    }
                    
                    // 渲染评论列表
                    function renderComments(comments) {
                        const commentsList = document.getElementById('comments-list');
                        commentsList.innerHTML = comments.map(comment => `

                                </div>
                                <div class="comment-content">${comment.content}</div>
                            </div>
                        `).join('');
                    }
                    
                    // 初始化页面
                    document.addEventListener('DOMContentLoaded', function() {
                        // 默认显示人气评论

                        // 绑定排序按钮事件

                                this.classList.add('active');
                                
                                // 排序并渲染评论

                            });

    <script>
        // 搜索功能
        document.addEventListener('DOMContentLoaded', function() {
            const searchInput = document.getElementById('search-input');
            const searchBtn = document.getElementById('search-btn');
            
            // 搜索按钮点击事件
            if (searchBtn) {
                searchBtn.addEventListener('click', function() {
                    performSearch();
                });
            }
            
            // 搜索框回车事件
            if (searchInput) {
                searchInput.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') {
                        performSearch();
                    }
                });
            }
            
            function performSearch() {
                const query = searchInput.value.trim();
                if (query) {
                    // 跳转到首页并携带搜索参数
                    window.location.href = '../index.html?search=' + encodeURIComponent(query);
                } else {
                    // 如果搜索为空，只跳转到首页
                    window.location.href = '../index.html';
                }
            }
        });
    </script>
