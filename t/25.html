ntent":"声音超小"},{"id":193773,"teacher_id":25,"teacher_name":"刘英","post_time":"2024-06-18 02:27:52","like_diff":6,"likes":6,"dislikes":0,"content":"美丽的刘老师捞捞我qwq"},{"id":177673,"teacher_id":25,"teacher_name":"刘英","post_time":"2023-07-04 07:36:52","like_diff":3,"likes":3,"dislikes":0,"content":"还行，历年卷得背"},{"id":195810,"teacher_id":25,"teacher_name":"刘英","post_time":"2024-06-30 04:06:14","like_diff":2,"likes":2,"dislikes":0,"content":"美丽的刘老师 讲课好 给分又超级好 人也超级温柔 看到群里发谢谢老师就偷偷把群解散了"},{"id":184501,"teacher_id":25,"teacher_name":"刘英","post_time":"2023-12-21 05:12:58","like_diff":1,"likes":1,"dislikes":0,"content":"电科DSP，课程内容有用难度适中，老师讲课好给分也好"},{"id":221502,"teacher_id":25,"teacher_name":"刘英","post_time":"2025-06-24 05:24:28","like_diff":1,"likes":1,"dislikes":0,"content":"好老师，无敌"},{"id":218856,"teacher_id":25,"teacher_name":"刘英","post_time":"2025-05-09 01:36:43","like_diff":0,"likes":0,"dislikes":0,"content":"自动控制讲的很好，给分也很好。"},{"id":221372,"teacher_id":25,"teacher_name":"刘英","post_time":"2025-06-23 06:22:25","like_diff":0,"likes":0,"dislikes":0,"content":"讲课水平和给分都十分完美"},{"id":221551,"teacher_id":25,"teacher_name":"刘英","post_time":"2025-06-24 11:58:51","like_diff":0,"likes":0,"dislikes":0,"content":"dsp讲课清晰，给分很棒，老师人很温柔，平时沟通起来有一种如沐春风感"},{"id":221712,"teacher_id":25,"teacher_name":"刘英","post_time":"2025-06-25 11:15:26","like_diff":0,"likes":0,"dislikes":0,"content":"DSP成绩组成：出勤+小测10%，作业20%，实验报告20%，期末考试50%。课后作业或实验讲解每次加两分，鼓励参加。\n\n首先谈谈点名，ly老师的点名其实蛮随机的，找不出规律，不过一般进行小测的时候就不点名了，考虑到DSP这门课大量的记忆点，能到课还是到课吧。\n\n小测是每章讲完之后在学在浙大会有一个小测题，基本上考点概念选择题，当然也会有计算题。平时如果课上真没看的话，那得小心下次课是否要到章节末尾了，一般讲完之后一定会有小测的。\n\n作业和实验没什么好讲的，作业有答案，但是答案也有不对的地方，建议自己做增强记忆点，毕竟考试也是纯靠基本功的。实验的话问问ds老师也能解决了，总的来说没啥大问题。当然老师会鼓励大家进行作业讲解，每次能加两分，一般来说讲解作业的人比较多，讲解实验的反而较少，这两分建议有能力的同学可以报名，争不到作业讲解的可以讲讲实验，你讲的有遗漏老师也会在旁边补充。\n\n这门课最重量级就是期末考试，大量的记忆点加上闭卷（是的，连A4纸都没有，算法和AI反而都有）使得考试存在一定难度，只靠期末的补天是非常难取得高分的！一定要在平时就积累学习，不要在考试周才后悔平时没看。当然要是大佬可以直接无视这句话，但如果是连信号与系统的基础都不怎么样的，我建议是好好掂量掂量。\n\n老师是一位好老师，讲解也很到位，也鼓励学生主动学习，但是上课期间最好不要和同学交头接耳，看得出来老师并不太喜欢讲课时底下有声音，当然如果是回答\\提出问题是可以的。期末会给出考试范围和考试总复习，实际上总复习覆盖面挺广的，但是一些概念还是得自己去找。\n\n总而言之：DSP这门课可以选，但是学习能力较差的同学一定不要只想着期末补天补出好成绩，平时要注重积累，作业题尽量自己完成巩固知识点。"},{"id":35104,"teacher_id":25,"teacher_name":"刘英","post_time":"2016-11-07 00:39:39","like_diff":-23,"likes":1,"dislikes":24,"content":"非常差，烂透了"}];

                        `).join('');
                    }
                    
                    // 初始化页面

                    performSearch();
                });
            }
            
            // 搜索框回车事件
            if (searchInput) {
                searchInput.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') {
                        performSearch();
                    }
                });
            }
            
            function performSearch() {
                const query = searchInput.value.trim();
                if (query) {
                    // 跳转到首页并携带搜索参数
                    window.location.href = '../index.html?search=' + encodeURIComponent(query);
                } else {
                    // 如果搜索为空，只跳转到首页
                    window.location.href = '../index.html';
                }
            }
        });
    </script>
</body>
</html>
