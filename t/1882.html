                    const commentsData = [{"id":218173,"teacher_id":1882,"teacher_name":"张丰","post_time":"2025-04-29 14:06:10","like_diff":78,"likes":84,"dislikes":6,"content":"【地球科学大数据】：一门逆天sb答辩大水课\n\n这种答辩课还当宝贝似的，同样的算法从大一讲到大三，培养方案都烂完了（地信这种答辩课太多了），一个专业需要三个这么多学分的sb短学期实习来填充，可想而知。\n\n搞个7、8个助教的助教天团，不知道的还以为走秀呢，居然还有大四的，我不觉得他们有什么水平和资格来指导，就是硬凑人头，自己连个本科毕设都没做完，我请问他们自己懂个鸡毛不？\n\n知道自己上课科研水平烂去计院舔个老师来上（挺好有自知之明），本意是好的，结果照样上的一塌糊涂。把一门本来是很重要的专业课上成ai讲座，张口闭口就是openai，奥特曼，何凯明，大模型的，搞得乱七八糟，我请问一个地学的本科生搞什么大模型？再说你地科院最得意的200张A800呢？怎么我们一张都没看到？还搞什么百度aistudio，充A币，我A个大头鬼，导入个包导个2分钟。说什么为了方便使用深度学习环境，难道自己在本地配环境不是才是问题最多，最需要手把手教的吗，讲讲这种泛泛的概念谁不知道\n\n地信的同学上这种课纯纯浪费时间，绝大部分内容都是学过的，还每次猥猥琐琐的转过来看来了多少学生，想着3分钟限时雷达点名为难学生。\n\n布置那种无聊的答辩作业就算了，说什么鼓励用ai，都tm是ai写的，打你妈的分，是想看看谁用的ai能力更强、版本更高吗？作业给分还跟shit一样。就tm一个卷积、全连接还要写什么文字总结，总结你妈。\n\n说实话上这课就是小丑，我但凡再来一次就吃屎，花了360块钱找罪受，这是我大学上到现在最反感最讨厌的课了。\n\n我希望张丰老师好好改革一下gis的培养模式，讲的难听一点，浙大地信真的太烂了，完全没有本科生培养体系，整体科研氛围也比计院差远了，这群搞gis的比技术比不过搞cs的，比地理素养也比不过大气地质的，真不知道gis还会什么"},{"id":219042,"teacher_id":1882,"teacher_name":"张丰","post_time":"2025-06-19 13:11:50","like_diff":69,"likes":71,"dislikes":2,"content":"大数据是我见过最傻逼最唐的课没有之一，上完这课感觉lj和llz都变慈祥了\n\n傻逼牛魔大数据，弱智百度死丢丢，狗屎\n\n怎么期末还要布置大作业写报告啊，真的是傻逼吧\n\n临时更改期末考形式，改成半开卷6666，明年是不是要闭卷了hhh\n\n从老师助教到作业考试全tm是傻逼"},{"id":222052,"teacher_id":1882,"teacher_name":"张丰","post_time":"2025-06-29 08:20:59","like_diff":47,"likes":49,"dislikes":2,"content":"【3S集成综合实践】：一门逆天sb给张丰老师打黑工的恶心课（没错，我又来喷了，实在看不下去了）\n\n你确定GIS大三暑假这个短学期所谓的3S实践是地科院的正经课程吗？我看这几个选题完全没看出半点3S的影子，我看就一个纯纯的CS吧\n\n每次教室里助教快比学生多我就不说了，“强大的导师、助教团队”？这话说出来不是纯小丑吗🤡纯招笑啊\n\n你确定你给的这几个选题大家都感兴趣吗，或者我感兴趣的能选到吗？为什么不能自由定选题，一定要做你给的？我现在非常怀疑你是不是想让我们花钱给你打白工，你自己和研究生的无聊逆天idea强加给学生做，还限制每隔3天汇报，这不就是硬把学生绑在学校给你打工？就算我做出来了，idea是你的，我能一作吗？甚至开学之后才汇报，你是想把大家整个暑假的时间都占用吗，我请问？\n\n你知道你搞三个短学期给部分同学造成多大的麻烦？假期时间宝贵，如果有人要准备考研、出国、实习、暑研，就完全被这短学期卡死了\n\n话说回来，你是 “地球科学学院” 的老师对吧，我不否认现在人工智能特别火特很重要，但你确定地科院的老师一头扎进纯计算机卷的浪潮中是对的吗？你看看现在顶会每年投稿量多少？你也想去卷？你的选题介绍还nips、icml，你是想让你的学生对标ccfa的工作还是怎么着，你确定你能卷的过cs的人吗？你有完整的培养体系吗？一个地理方面的老师不好好做地理相关的研究，天天卷cs的热点技术方法，你这样为什么不去计算机学院当老师，要留在地科院恶心别人？你看现在纯自然地理和人文地理的老师还有没有出路。\n\n多的不说了，张丰老师就是地科院大数据派的带头人，纯纯的想CS化！"},{"id":222165,"teacher_id":1882,"teacher_name":"张丰","post_time":"2025-06-30 14:29:27","like_diff":42,"likes":44,"dislikes":2,"content":"【3S集成综合应用】\n\n计院卧底混地科，恰逢染上A I 魔。\n\n大数据来当令尊，大模型来当令堂。\n\n地理研究看不起，地学知识全不懂。\n\n编纂代码装诸葛，计院正统难高攀。\n\n科研仕途遭瓶颈，转而报复众学生。\n\n短学期有二十天，杭州夏日热炎炎。\n\n十六助教凑排场，虚张声势曰强大。\n\n课名说是 3  S ，细看选题真想死。\n\n要么预测大模型，要么问答智能体。\n\n或与地学无关系，实则一点不相关。\n\n选题强制且不谈，还需要抢又何意。\n\n三日一报如律令，总共汇报六有余。\n\n次次汇报需到齐，否则扣分无商议。\n\n强征暑假当苦力，开学答辩才算毕。\n\n若需实习或考研，组内沟通自解决。\n\n学生时间为何物，我只要你的成果。\n\n半成品里刨金钵，东拼西凑供上桌。\n\n美其名曰为后人，实则剽窃乐开颜。\n\n跨界蝗虫啃资源，劣质平台为财源。\n\n自诩A I 急先锋，误人子弟罪难容。\n\n堪比伐木工下岗，真是无斧又无木。"},{"id":219784,"teacher_id":1882,"teacher_name":"张丰","post_time":"2025-07-01 12:51:43","like_diff":39,"likes":43,"dislikes":4,"content":"喜欢搞CS，是因为你自己是一个CS吗"},{"id":222050,"teacher_id":1882,"teacher_name":"张丰","post_time":"2025-07-09 00:26:16","like_diff":35,"likes":39,"dislikes":4,"content":"看到学弟学妹们的评价，我也来说两句。\n\n地科某国优计划（师范双学位）学生，现任GIS应用开发助教（熟悉的应该能猜到我是谁）。\n\n保研之后跟张丰说想要尽我所能改变一下浙大GIS本科课程教学，比如尽可能让同学们能在课程中真正学到一些新知识，提升面向科研和就业的实践能力，同时避免无意义的讲座式的课程和浪费时间的水课，不要一些东西一直扯来扯去或者炒冷饭然后把所有重点塞到一门GIS应用开发里去，张丰给我的回复是：她不想要国优计划的学生\n\n为什么不想要国优计划的学生？因为双学位没有足够的时间给她打工；同时要是真的地科院本科课程被优化，增加一些有用的内容，那就没有学生在地球科学大数据课上给她的平台测试打工；没有人在3S集成综合实践课上给她的idea打工了。\n\n学弟学妹们要知道一件事，纵观地科院本科四年的培养方案，你会发现所有的水课和垃圾课都是地科院的老师上的，所有的有点用的课（FDS，地理空间数据库等等）都是计院老师上的。GIS开发一大堆东西压缩到一门2.5学分的课来折磨人，毕业之后你会发现根本比不过CS的那些学过计算机网络，操作系统还有一大堆项目经验和实习经验的同学（你地科有什么比赛项目？GIS应用大赛一届只能出四个人，挑战杯...隔壁评论下面说了）。地科院的老师就没想过好好上课，我进了课题组才知道原来GIS实验室有这么多老师和研究员，结果上个大二短学期还要踢皮球踢来踢去。GIS的导师他们的重点根本没有放在上课上，如果保研本校你会发现研究生课就是反反复复上四五次地球科学大数据。"},{"id":222246,"teacher_id":1882,"teacher_name":"张丰","post_time":"2025-07-02 02:01:27","like_diff":32,"likes":32,"dislikes":0,"content":"助力收敛1，这种sb老师能不能滚啊！张丰给我感觉就是一个心胸极其阴暗狭隘自私的老太婆，各种为难学生，强迫本科生给她打工。一个地科院的老师这么喜欢做计算机的东西，真的跟哈巴舔狗一样舔计院，纯纯🐶shit。我tm去外面实习不香吗，一定要在这里部署你🐶shit的大模型，真的🍬完了"},{"id":222109,"teacher_id":1882,"teacher_name":"张丰","post_time":"2025-07-09 00:19:05","like_diff":27,"likes":28,"dislikes":1,"content":"GIS培养方案都是张丰设计的\n\n三个超长短学期也都是她想出来的\n\n本科教学改革会议是不让本科生参加的"},{"id":222522,"teacher_id":1882,"teacher_name":"张丰","post_time":"2025-07-10 03:19:54","like_diff":25,"likes":26,"dislikes":1,"content":"学弟学妹们早点认识到zf是个喜欢cs的大cs吧，能转专业跨专业的就润吧，gis真的是一坨翔，这么大的实验室半篇子刊都没有，实力不如别的学院的小研究员。登记使用A800，我真是笑了，一个短学期要搞就好好搞，不会搞就别搞了，有的组训你的大模型一个epoch好几个小时，真把自己当什么了？这个短学期除了让我感觉恶心至极，没有任何帮助，我不觉得我能学到什么东西，请不要主观臆断认为给你打工能学到什么，何况还不一定有产出。zf凭一己之力毁完gis，为什么这段时间这么多人骂不是没有原因的，而且也不是几个人，是很多人。你这样浪费我们时间就是谋财害命，在学校我还尊称您一声老师，等毕业出校了看我给不给你一巴掌就完了"},{"id":219597,"teacher_id":1882,"teacher_name":"张丰","post_time":"2025-05-31 04:00:52","like_diff":19,"likes":22,"dislikes":3,"content":"尼玛的狗屎期末最后一周突然布置大作业，强迫人家用这个劣质小平台，还要写报告，神经病吧。考试也改成半开卷，真的太恶心了"},{"id":222299,"teacher_id":1882,"teacher_name":"张丰","post_time":"2025-07-03 02:10:46","like_diff":17,"likes":17,"dislikes":0,"content":"牛逼真牛逼。自己的短学期安排能记错时间，浪费全班同学和助教一个小时，大热天来回一趟东四有多累不用多说了吧。司马玩意早点埋了吧。"},{"id":221598,"teacher_id":1882,"teacher_name":"张丰","post_time":"2025-06-25 01:17:49","like_diff":16,"likes":17,"dislikes":1,"content":"上个3S短学期实践，来了16个助教，我真是服了，这么多个助教也没见得有什么用呀，有这个时间耗费那么多人力，不如好好改革一下课程"},{"id":222464,"teacher_id":1882,"teacher_name":"张丰","post_time":"2025-07-07 08:49:25","like_diff":16,"likes":17,"dislikes":1,"content":"最大的感受是没有从她那里得到任何应有的尊重。我从来没有见过这么多雷点出现在同一个人身上：\n\n第一是随意更改考试形式，而且在学期末才通知，没有一点规范性可言；\n\n第二是把大三短学期设置成几个看不出和专业有什么联系的项目的研究，而且明面上“只”占据20天，实则要到秋学期开学才结题汇报，占据了整个暑假，浪费各位在毕业季前最后的一段完全空闲的时间；\n\n三是没有基本的礼貌，集中汇报的时候让所有人等她一个小时，借口是在第二次汇报的时候把自己定的三天一汇报制度给忘记了？试想一下反过来如果是要汇报的学生迟到了一小时，他会不会在她的小本本上狠狠给那组扣分呢？\n\n四是听取他人的演讲和展示的时候喜欢肆无忌惮的打断别人发表自己的意见，而不是等到结束之后再做评论，估计她研究生组会也是这么干的吧，可怜一下她手下的那些研究生同学，对待一门短学期课程的本科生尚且如此，那对那些毕业大事控制在她手里的研究生来说可能并不是十分自由吧。但是gis本科生并不是她手底下的研究生，有的人是想工作的，但是她对实习的态度是什么呢？是不屑一顾，认为她这个短学期比实习有用的太多…\n\n只能说她在短短一学期内让我从无感变成厌恶，也是有点水平在的。"},{"id":220586,"teacher_id":1882,"teacher_name":"张丰","post_time":"2025-06-18 15:56:03","like_diff":13,"likes":16,"dislikes":3,"content":"脑瘫大数据啊 期末周一天一门考试还要写这个b大作业 这大作业有什么意义呢 跟着那个弱智教程截一张又一张图 我请问我是刚上大学吗"},{"id":222242,"teacher_id":1882,"teacher_name":"张丰","post_time":"2025-07-01 18:05:08","like_diff":13,"likes":14,"dislikes":1,"content":"地球科学大数据就是史，给分也是史"},{"id":222297,"teacher_id":1882,"teacher_name":"张丰","post_time":"2025-07-02 22:05:02","like_diff":13,"likes":13,"dislikes":0,"content":"上过最南平的课，还放在核心课程，致力于迫害全地科院"},{"id":222520,"teacher_id":1882,"teacher_name":"张丰","post_time":"2025-07-10 02:17:43","like_diff":13,"likes":13,"dislikes":0,"content":"下面那个说满嘴喷粪的，不是很正常，因为上他的课不就是给我们喂shit，装不下了就喷出来了\n\n或者说，她就是一坨shit"},{"id":222053,"teacher_id":1882,"teacher_name":"张丰","post_time":"2025-06-29 08:23:14","like_diff":12,"likes":13,"dislikes":1,"content":"【3S集成综合实践】：一门逆天sb给张丰老师打黑工的恶心课（没错，我又来喷了，实在看不下去了）\n\n你确定GIS大三暑假这个短学期所谓的3S实践是地科院的正经课程吗？我看这几个选题完全没看出半点3S的影子，我看就一个纯纯的CS吧\n\n每次教室里助教快比学生多我就不说了，“强大的导师、助教团队”？这话说出来不是纯小丑吗🤡纯招笑啊\n\n你确定你给的这几个选题大家都感兴趣吗，或者我感兴趣的能选到吗？为什么不能自由定选题，一定要做你给的？我现在非常怀疑你是不是想让我们花钱给你打白工，你自己和研究生的无聊逆天idea强加给学生做，还限制每隔3天汇报，这不就是硬把学生绑在学校给你打工？就算我做出来了，idea是你的，我能一作吗？甚至开学之后才汇报，你是想把大家整个暑假的时间都占用吗，我请问？\n\n你知道你搞三个短学期给部分同学造成多大的麻烦？假期时间宝贵，如果有人要准备考研、出国、实习、暑研，就完全被这短学期卡死了\n\n话说回来，你是 “地球科学学院” 的老师对吧，我不否认现在人工智能特别火特很重要，但你确定地科院的老师一头扎进纯计算机卷的浪潮中是对的吗？你看看现在顶会每年投稿量多少？你也想去卷？你的选题介绍还nips、icml，你是想让你的学生对标ccfa的工作还是怎么着，你确定你能卷的过cs的人吗？你有完整的培养体系吗？一个地理方面的老师不好好做地理相关的研究，天天卷cs的热点技术方法，你这样为什么不去计算机学院当老师，要留在地科院恶心别人？你看现在纯自然地理和人文地理的老师还有没有出路。\n\n多的不说了，张丰老师就是地科院大数据派的带头人，纯纯的想CS化！"},{"id":222547,"teacher_id":1882,"teacher_name":"张丰","post_time":"2025-07-12 06:45:40","like_diff":12,"likes":16,"dislikes":4,"content":"很差的老师，人丑心恶。课程质量很低，是答辩，狠狠踩👎👎👎"},{"id":222548,"teacher_id":1882,"teacher_name":"张丰","post_time":"2025-07-12 06:54:39","like_diff":12,"likes":14,"dislikes":2,"content":"这老师怎么还有2分啊，不到-100都对不起她了😢😢😢"},{"id":51531,"teacher_id":1882,"teacher_name":"张丰","post_time":"2017-06-07 03:17:21","like_diff":11,"likes":12,"dislikes":1,"content":"最不喜欢的老师..."},{"id":155120,"teacher_id":1882,"teacher_name":"张丰","post_time":"2022-06-08 12:30:06","like_diff":11,"likes":11,"dislikes":0,"content":"讲课水平感觉不太行，凌乱无章，有待提高，考试背ppt很无语"},{"id":163184,"teacher_id":1882,"teacher_name":"张丰","post_time":"2022-12-09 e_diff":0,"likes":1,"dislikes":1,"content":"。。。"},{"id":226117,"teacher_id":1882,"teacher_name":"张丰","post_time":"2026-01-09 04:36:14","like_diff":0,"likes":0,"dislikes":0,"content":"懒得写"},{"id":222582,"teacher_id":1882,"teacher_name":"张丰","post_time":"2025-07-14 13:03:46","like_diff":-5,"likes":4,"dislikes":9,"content":"明天是3s的最后一次汇报，特在此记录🤗\n\n在这个短学期中我学到了不少东西，包括知识和人性，特别感谢张丰老师给我上的宝贵一课😊\n\n🖐️🖐️🖐️🖐️\n\n\\😭/\\😭/\n\n 👕  👙  \n\n 🍆  🅱️  \n\n 👖  👗\n\n 👞👞👠👠\n\n张老师永远伟大👍👍👍"},{"id":157917,"teacher_id":1882,"teacher_name":"张丰","post_time":"2022-06-25 14:32:29","like_diff":-14,"likes":3,"dislikes":17,"content":"emm"},{"id":222592,"teacher_id":1882,"teacher_name":"张丰","post_time":"2025-07-15 11:41:56","like_diff":-15,"likes":4,"dislikes":19,"content":"想做计算机cs、ai和大数据方向，但又去不了计院软院的同学可以考虑张丰老师哈！张丰老师组和计院朱强老师的强组深度合作，计院超级厉害的师兄师姐直接进驻地科院，配合地科院全校最强的A800超级集群简直无敌了，做cs和ai的势头很猛！大家要是留在本院真可以考虑哈，大大滴点赞！跟着张老师转码搞cs超方便！"},{"id":222544,"teacher_id":1882,"teacher_name":"张丰","post_time":"2025-07-12 01:01:20","like_diff":-22,"likes":5,"dislikes":27,"content":"很好的老师，人美心善。课程质量很高，点赞👍🏻"},{"id":222449,"teacher_id":1882,"teacher_name":"张丰","post_time":"2025-07-07 05:02:20","like_diff":-27,"likes":8,"dislikes":35,"content":"满口喷粪的评论区，见证物种多样性"},{"id":25202,"teacher_id":1882,"teacher_name":"张丰","post_time":"2016-05-08 01:28:16","like_diff":-32,"likes":6,"dislikes":38,"content":"gis程序设计，上课气氛有点诡异。。。经常几节课下来让同学自己写代码什么都不说。。。美丽的助教学姐还是很热心温柔的。。。上课环境不错，教室有阳台\n\n"},{"id":220729,"teacher_id":1882,"teacher_name":"张丰","post_time":"2025-06-19 10:55:07","like_diff":-38,"likes":14,"dislikes":52,"content":"评论区跳脚的连助教也一起骂真闹麻了，老博小硕被呼来喝去还得挨学生一顿骂回家一看真是天都塌了，地科院学生难道这点素质没有？"},{"id":83398,"teacher_id":1882,"teacher_name":"张丰","post_time":"2018-07-10 08:01:22","like_diff":-40,"likes":4,"dislikes":44,"content":"美女老师"},{"id":85072,"teacher_id":1882,"teacher_name":"张丰","post_time":"2018-07-15 08:33:53","like_diff":-40,"likes":0,"dislikes":40,"content":"人很好"},{"id":215380,"teacher_id":1882,"teacher_name":"张丰","post_time":"2025-02-25 14:20:07","like_diff":-40,"likes":2,"dislikes":42,"content":"人很好"},{"id":85070,"teacher_id":1882,"teacher_name":"张丰","post_time":"2018-07-15 08:32:39","like_diff":-41,"likes":3,"dislikes":44,"content":"女神老师"},{"id":114343,"teacher_id":1882,"teacher_name":"张丰","post_time":"2019-07-09 23:14:42","like_diff":-55,"likes":6,"dislikes":61,"content":"gis亲妈妈，美女老师，"}];
                    
                    // 排序函数
                    function sortComments(sortType) {
                        let sortedComments = [...commentsData];
                        
                        if (sortType === 'popular') {
                            // 按人气排序（点赞减点踩）
                            sortedComments.sort((a, b) => b.like_diff - a.like_diff);
                        } else if (sortType === 'latest') {
                            // 按时间排序（最新在前）
                            sortedComments.sort((a, b) => new Date(b.post_time) - new Date(a.post_time));
                        }
                        
                        return sortedComments;
                    }
                    
                    // 渲染评论列表
                    function renderComments(comments) {
                        const commentsList = document.getElementById('comments-list');
                        commentsList.innerHTML = comments.map(comment => `
                            <div class="comment-item">
                                <div class="comment-meta">
                                    <span class="comment-time">${comment.post_time}</span>
                                    <span class="comment-likes">
                                        <span class="likes"><i class="fas fa-thumbs-up"></i> ${comment.likes}</span>
                                        <span class="dislikes"><i class="fas fa-thumbs-down"></i> ${comment.dislikes}</span>
                                    </span>
                                </div>
                                <div class="comment-content">${comment.content}</div>
                            </div>
                        `).join('');
                    }
                    
                    // 初始化页面
                    document.addEventListener('DOMContentLoaded', function() {
                        // 默认显示人气评论
                        renderComments(sortComments('popular'));
                        
                        // 绑定排序按钮事件
                        document.querySelectorAll('.sort-btn').forEach(btn => {
                            btn.addEventListener('click', function() {
                                // 更新按钮状态
                                document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
                                this.classList.add('active');
                                
                                // 排序并渲染评论
                                const sortType = this.getAttribute('data-sort');
                                renderComments(sortComments(sortType));
                            });
                        });
                    });
                </script>
            </div>
            
        
        <!-- 页脚 -->
        <footer class="footer">
            <p>浙江大学教评查询系统 | 数据时效: 2026-01-11</p>
        </footer>
    </div>
    
    <script>
        // 搜索功能
        document.addEventListener('DOMContentLoaded', function() {
            const searchInput = document.getElementById('search-input');
            const searchBtn = document.getElementById('search-btn');
            
            // 搜索按钮点击事件
            if (searchBtn) {
                searchBtn.addEventListener('click', function() {
                    performSearch();
                });
            }
            
            // 搜索框回车事件
            if (searchInput) {
                searchInput.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') {
                        performSearch();
                    }
                });
            }
            
            function performSearch() {
                const query = searchInput.value.trim();
                if (query) {
                    // 跳转到首页并携带搜索参数
                    window.location.href = '../index.html?search=' + encodeURIComponent(query);
                } else {
                    // 如果搜索为空，只跳转到首页
                    window.location.href = '../index.html';
                }
            }
        });
    </script>
