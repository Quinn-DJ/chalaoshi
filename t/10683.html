                <script>
                    // 评论数据
                    const commentsData = [{"id":207825,"teacher_id":10683,"teacher_name":"白宏震","post_time":"2024-12-26 13:02:28","like_diff":21,"likes":22,"dislikes":1,"content":"白老师要求每节课到课，请假要正式，有时会吐槽大家作业字不好，但绝对不是一个事多的老师。白老师讲课很用心，鼓励大家发言，作业布置的少，不给大家增加负担，还带着大家复习，提醒大家准备A4纸和计算器，绝对不应该得到这么低的评价，想选白老师课的人就放心选吧，别受负面评论的干扰。"},{"id":208144,"teacher_id":10683,"teacher_name":"白宏震","post_time":"2024-12-26 02:38:30","like_diff":18,"likes":18,"dislikes":0,"content":"学的白老师的分析化学。\n\n老师很温柔，作业留的少，上课很有激情。虽然偏爱字好看、爱发言、坐前排的学生，但是对每个学生都是平等且负责的。\n\n老师的上课态度很板正，用收发作业本的形式看大家到齐没有。白老师看不惯迟到、睡觉、翘课和请假。\n\n上课不局限于书本和PPT，会拓展一些知识，是真的想要教会我们知识的。"},{"id":205652,"teacher_id":10683,"teacher_name":"白宏震","post_time":"2024-12-10 22:15:05","like_diff":13,"likes":14,"dislikes":1,"content":"作业很少。"},{"id":209892,"teacher_id":10683,"teacher_name":"白宏震","post_time":"2025-01-07 10:37:20","like_diff":11,"likes":11,"dislikes":0,"content":"老师上课其实很有激情，也会和班里的的同学互动，想认真学的同学可以报白老师的课，不要被一些负面的言论影响。平时会偶尔留作业和点名，但是能上课坚持去，作业坚持做，就算做的不好平时分也会拉满，不用担心。(PS：老师喜欢线下的点名，所以最好早一点到，去迟了被点到真的会很尴尬。)期末考试是半开卷的，就是可以带一张A4纸进去，最好自己先开始做，就参照98上的就行，有好多做的很精美的。其实白老师自己划的重点有点太啰嗦了，很多都是不考的，尤其是结构图，不用等到最后一节讲完才开始复习。题目会考的很细，但基本都是上课讲过的内容，书最好认真看一遍，像很多举例分析的内容都是考点。成功拿下大一的第一个5.0，比某个普通化学的wjm好多了"},{"id":209490,"teacher_id":10683,"teacher_name":"白宏震","post_time":"2025-01-06 05:31:59","like_diff":10,"likes":10,"dislikes":0,"content":"老师很负责很关心同学，可能平时上课管的会有点多，但是讲课讲的很清楚，期末也会捞人。豪老师，选他"},{"id":208320,"teacher_id":10683,"teacher_name":"白宏震","post_time":"2024-12-27 01:07:16","like_diff":8,"likes":8,"dislikes":0,"content":"就在他代课的时候上了一节课，但真的收获特别多，只要认真听跟老师互动就能听的很爽。综合的不清楚，但上课上的是真的好"},{"id":209753,"teacher_id":10683,"teacher_name":"白宏震","post_time":"2025-01-07 03:37:38","like_diff":7,"likes":9,"dislikes":2,"content":"很好很负责的老师，考完之后还特意给我发私信鼓励我继续加油，上课也很好，对同学真的很关心，作业也少，考前划重点几乎全覆盖，甚至2个月时间还会去记同学的名字，真的很庆幸碰到他"},{"id":201663,"teacher_id":10683,"teacher_name":"白宏震","post_time":"2024-11-05 07:50:34","like_diff":6,"likes":15,"dislikes":9,"content":"好老师，上课幽默，作业少"},{"id":209936,"teacher_id":10683,"teacher_name":"白宏震","post_time":"2025-01-07 13:04:52","like_diff":6,"likes":6,"dislikes":0,"content":"很好的老师，真的在认真的上课，想学到知识的同学完全可以闭眼选，作业少，刀子嘴豆腐心，很耐心的留下来回答同学们的问题，唯一的缺点可能会有一点像教高中生一样，总体还是很推荐的，不应该是这么低的分数"},{"id":205621,"teacher_id":10683,"teacher_name":"白宏震","post_time":"2024-12-10 07:28:07","like_diff":5,"likes":9,"dislikes":4,"content":"感觉他有一种讲了笑话没人笑的无力感"},{"id":209881,"teacher_id":10683,"teacher_name":"白宏震","post_time":"2025-01-07 10:11:38","like_diff":5,"likes":6,"dislikes":1,"content":"老师真的是好老师，很负责，只要平常上课都到作业都写，平时分都会很高，期末给分也好好，大学第一门满绩，谢谢老师！可冲"},{"id":209903,"teacher_id":10683,"teacher_name":"白宏震","post_time":"2025-01-07 11:07:54","like_diff":5,"likes":5,"dislikes":0,"content":"挺好的老师有魅力"},{"id":209990,"teacher_id":10683,"teacher_name":"白宏震","post_time":"2025-01-07 23:53:26","like_diff":5,"likes":5,"dislikes":0,"content":"给分好，相信这才是很多人最关心的吧，"},{"id":205765,"teacher_id":10683,"teacher_name":"白宏震","post_time":"2024-12-12 03:09:53","like_diff":3,"likes":12,"dislikes":9,"content":"请假不让在网上请？我要是能去班里上课那我为什么还要请假？"},{"id":210669,"teacher_id":10683,"teacher_name":"白宏震","post_time":"2025-01-09 15:14:02","like_diff":3,"likes":4,"dislikes":1,"content":"总体上是不错的老师，教学非常认真负责，讲的也比较仔细，比较重视出勤率和学习态度。作业很少，也没有小测。在课余比较关心学生。\n\n但是也有一些小缺点，比如说钉钉回复比较慢，有的时候甚至已读不回。还有没有说明平时分最高90，由于作业和签到基本拉不开差距，所以最后就取决于你上课回答问题的频率了TAT……至于绝大多数不怎么发言的同学，给的分就相当随机。不过放心，只要作业和出勤都好，差的也不会很多。\n\n在我看来评分至少是8.5以上吧，不知道为什么只有五点几，打个十分平衡一下。"},{"id":221665,"teacher_id":10683,"teacher_name":"白宏震","post_time":"2025-06-25 07:09:09","like_diff":2,"likes":2,"dislikes":0,"content":"老师人很好很负责，但比较严厉，要求纸质签到和作业按时交，很讨厌上课迟到。但给分很不错，考前划重点真的是重点哦，考前重点听明白就基本稳了"},{"id":219375,"teacher_id":10683,"teacher_name":"白宏震","post_time":"2025-05-26 05:51:31","like_diff":1,"likes":2,"dislikes":1,"content":"emm，老师情绪很不稳定，大化A气相色谱如果是这个老师，那你就等着被骂吧。。。。。"},{"id":221165,"teacher_id":10683,"teacher_name":"白宏震","post_time":"2025-06-21 15:42:34","like_diff":1,"likes":1,"dislikes":0,"content":"白老师其实上课很有激情吧，很用心会去记大家名字，实验课可能老师性格有些急，就可能比较有压力。但分析化学老师真的讲的很用心，看得出来老师真的很热爱科研也很用心在教学，会提醒大家复习                     function sortComments(sortType) {
                        let sortedComments = [...commentsData];
                        
                        if (sortType === 'popular') {
                            // 按人气排序（点赞减点踩）
                            sortedComments.sort((a, b) => b.like_diff - a.like_diff);
                        } else if (sortType === 'latest') {
                            // 按时间排序（最新在前）
                            sortedComments.sort((a, b) => new Date(b.post_time) - new Date(a.post_time));
                        }
                        
                        return sortedComments;
                    }
                    
                    // 渲染评论列表
                    function renderComments(comments) {
                        const commentsList = document.getElementById('comments-list');
                        commentsList.innerHTML = comments.map(comment => `
                            <div class="comment-item">
                                <div class="comment-meta">
                                    <span class="comment-time">${comment.post_time}</span>
                                    <span class="comment-likes">
                                        <span class="likes"><i class="fas fa-thumbs-up"></i> ${comment.likes}</span>
                                        <span class="dislikes"><i class="fas fa-thumbs-down"></i> ${comment.dislikes}</span>
                                    </span>
                                </div>
                                <div class="comment-content">${comment.content}</div>
                            </div>
                        `).join('');
                    }
                    
                    // 初始化页面
                    document.addEventListener('DOMContentLoaded', function() {
                        // 默认显示人气评论
                        renderComments(sortComments('popular'));
                        
                        // 绑定排序按钮事件
                        document.querySelectorAll('.sort-btn').forEach(btn => {
                            btn.addEventListener('click', function() {
                                // 更新按钮状态
                                document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
                                this.classList.add('active');
                                
                                // 排序并渲染评论
                                const sortType = this.getAttribute('data-sort');

                            });
                        });

    <script>
        // 搜索功能
        document.addEventListener('DOMContentLoaded', function() {
            const searchInput = document.getElementById('search-input');
            const searchBtn = document.getElementById('search-btn');
            
            // 搜索按钮点击事件
            if (searchBtn) {
                searchBtn.addEventListener('click', function() {
                    performSearch();
                });
            }
            
            // 搜索框回车事件
            if (searchInput) {
                searchInput.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') {
                        performSearch();
                    }
                });
            }
            
            function performSearch() {
                const query = searchInput.value.trim();
                if (query) {
                    // 跳转到首页并携带搜索参数
                    window.location.href = '../index.html?search=' + encodeURIComponent(query);
                } else {
                    // 如果搜索为空，只跳转到首页
                    window.location.href = '../index.html';
                }
            }
        });
    </script>
