_name":"高海春","post_time":"2024-06-23 11:50:19","like_diff":3,"likes":4,"dislikes":1,"content":"老师改卷很快，有展示加分，期中全是选择，期末参考历年卷可以灵活复习。最终给分还不错，挺捞的"},{"id":220399,"teacher_id":2659,"teacher_name":"高海春","post_time":"2025-06-17 16:14:46","like_diff":3,"likes":3,"dislikes":0,"content":"本学期班里超过一班的人总评上不了八十，怪不得查老师他的微生物均绩3.6几呢。。。\n\n高老师平常讲课语速确实很慢，讲的东西也有点乱，不是很系统。期末75分的大题考了很多微生物分子遗传调控、分子技术（怎样设计实验验证…）之类的内容，但上课讲的又不深入，感觉对没有学过遗传、分子的同学略显不友好。\n\n个人感觉他是有些个人素养比如最后一节课分享酒文化能看出来他读过很多文学/电影之类的，但真的有点自以为是。\n\n总之就是很难评呀，叹气"},{"id":79444,"teacher_id":2659,"teacher_name":"高海春","post_time":"2018-06-05 08:10:59","like_diff":2,"likes":4,"dislikes":2,"content":"有点毒舌但是超可爱的老师！"},{"id":217011,"teacher_id":2659,"teacher_name":"高海春","post_time":"2025-03-31 08:50:42","like_diff":2,"likes":2,"dislikes":0,"content":"上课水平很一般，英文PPT，专业名词不翻译，只翻译一些简单的词汇"},{"id":220279,"teacher_id":2659,"teacher_name":"高海春","post_time":"2025-06-17 05:14:21","like_diff":2,"likes":2,"dislikes":0,"content":"高分很高，低分很低。讲课一般"},{"id":30062,"teacher_id":2659,"teacher_name":"高海春","post_time":"2016-07-01 01:30:04","like_diff":1,"likes":3,"dislikes":2,"content":"还不错哦"},{"id":194187,"teacher_id":2659,"teacher_name":"高海春","post_time":"2024-06-22 11:36:56","like_diff":1,"likes":1,"dislikes":0,"content":"改试卷速度很快"},{"id":216161,"teacher_id":2659,"teacher_name":"高海春","post_time":"2025-03-11 08:47:48","like_diff":1,"likes":1,"dislikes":0,"content":"讲不清楚"},{"id":216585,"teacher_id":2659,"teacher_name":"高海春","post_time":"2025-03-19 02:06:06","like_diff":1,"likes":1,"dislikes":0,"content":"哈基米哈基米哈基米哈基米哈基米哈基米哈基米"},{"id":220781,"teacher_id":2659,"teacher_name":"高海春","post_time":"2025-06-19 16:36:30","like_diff":1,"likes":1,"dislikes":0,"content":"小组展示说是自愿，但又占总评5分，限期中考班级成绩前40％参加，40％以后的每小组最多一人，没抢上总评5分没了，绩点直接掉两个档。唉，虽然老师本意是说“期中没考好的同学好好复习”，但我离40％就差一分呐，这报不上就强行拉大了分数差距，变相提高了期中考试的分数占比啊...平常讲课没什么重点，钉钉也从不回复，考试纯靠看历年题...纯英文卷...反正大家慎选吧"},{"id":221090,"teacher_id":2659,"teacher_name":"高海春","post_time":"2025-06-21 08:14:20","like_diff":1,"likes":1,"dislikes":0,"content":"怎么说呢，虽然最后给分也不坏，而且个人比较喜欢最后一节课他讲的酒文化和鼓励我们hardwork的内容，能看出确实有些人文素养，但是优绩主义、社达主义和自负这点确实没得说，听说他的实验室也很压抑，白天都锁着门。总之个人认为不是可以亲近的类型。复习的话用历年卷就可以，上课听讲的话随缘吧。还是要好好看教材。"},{"id":117961,"teacher_id":2659,"teacher_name":"高海春","post_time":"2019-10-17 02:31:51","like_diff":0,"likes":1,"dislikes":1,"content":"。。。"},{"id":159029,"teacher_id":2659,"teacher_name":"高海春","post_time":"2022-07-05 00:54:04","like_diff":-9,"likes":2,"dislikes":11,"content":"老师的确是狠狠调分了\n\n全班没有一个人挂\n\n我期中还行 期末只复习了一晚 总评也有83"},{"id":32349,"teacher_id":2659,"teacher_name":"高海春","post_time":"2016-07-06 08:08:56","like_diff":-13,"likes":8,"dislikes":21,"content":"感觉是生科院最好的老师之一"},{"id":35274,"teacher_id":2659,"teacher_name":"高海春","post_time":"2016-11-07 12:54:31","like_diff":-15,"likes":7,"dislikes":22,"content":"生科院最好老师之一"},{"id":125344,"teacher_id":2659,"teacher_name":"高海春","post_time":"2020-09-07 06:36:21","like_diff":-19,"likes":3,"dislikes":22,"content":"谢谢高老师给我这个英语渣4.5"},{"id":155583,"teacher_id":2659,"teacher_name":"高海春","post_time":"2022-06-14 12:41:40","like_diff":-25,"likes":3,"dislikes":28,"content":"怎么好几个满绩的。。。看来老师确实狠狠调分了。。4.8也能接受吧🤒"}];

                                        <span class="likes"><i class="fas fa-thumbs-up"></i> ${comment.likes}</span>
                                        <span class="dislikes"><i class="fas fa-thumbs-down"></i> ${comment.dislikes}</span>
                                    </span>
                                </div>
                                <div class="comment-content">${comment.content}</div>
                            </div>
                        `).join('');
                    }
                    
                    // 初始化页面
                    document.addEventListener('DOMContentLoaded', function() {
                        // 默认显示人气评论
                        renderComments(sortComments('popular'));
                        
                        // 绑定排序按钮事件
                        document.querySelectorAll('.sort-btn').forEach(btn => {
                            btn.addEventListener('click', function() {
                                // 更新按钮状态
                                document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
                                this.classList.add('active');
                                
                                // 排序并渲染评论
                                const sortType = this.getAttribute('data-sort');
                                renderComments(sortComments(sortType));
                            });
                        });
                    });
                </script>
            </div>
            
        
        <!-- 页脚 -->
        <footer class="footer">
            <p>浙江大学教评查询系统 | 数据时效: 2026-01-11</p>
        </footer>
    </div>
    
    <script>
        // 搜索功能
        document.addEventListener('DOMContentLoaded', function() {
            const searchInput = document.getElementById('search-input');
            const searchBtn = document.getElementById('search-btn');
            
            // 搜索按钮点击事件
            if (searchBtn) {
                searchBtn.addEventListener('click', function() {
                    performSearch();
                });
            }
            
            // 搜索框回车事件
            if (searchInput) {
                searchInput.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') {
                        performSearch();
                    }
                });
            }
            
            function performSearch() {
                const query = searchInput.value.trim();
                if (query) {
                    // 跳转到首页并携带搜索参数
                    window.location.href = '../index.html?search=' + encodeURIComponent(query);
                } else {
                    // 如果搜索为空，只跳转到首页
                    window.location.href = '../index.html';
                }
            }
        });
    </script>
</body>
</html>
