kes":3,"content":"小测时间好短真的写不完"},{"id":220937,"teacher_id":10246,"teacher_name":"钟先平","post_time":"2025-06-20 11:40:31","like_diff":5,"likes":5,"dislikes":0,"content":"我看往年的大物，我感觉我轻轻松松上4.5，但今年，怎么说呢，平时分被扣了8分，恩，小测很不合理，就是难度和时间，大家可以跑了。"},{"id":217109,"teacher_id":10246,"teacher_name":"钟先平","post_time":"2025-04-02 03:01:29","like_diff":4,"likes":9,"dislikes":5,"content":"小测时间短难度较大真的好吗？\n\n小测要区分度真的对吗？"},{"id":217115,"teacher_id":10246,"teacher_name":"钟先平","post_time":"2025-04-02 05:27:38","like_diff":3,"likes":7,"dislikes":4,"content":"小测做不完，呜呜呜"},{"id":220916,"teacher_id":10246,"teacher_name":"钟先平","post_time":"2025-06-21 06:16:48","like_diff":3,"likes":4,"dislikes":1,"content":"不会捞，一般吧，平时分就那样赋分赋起来。。。\n\n被杀了wwwwwwwwwwwwwww\n\n没实力的别来，有实力的可以选更好的（）\n\n\n\n反驳一下楼下的\n\n其实你是一只猫也不一定管用（）"},{"id":221148,"teacher_id":10246,"teacher_name":"钟先平","post_time":"2025-06-21 13:32:33","like_diff":2,"likes":6,"dislikes":4,"content":"教学水平上，他自己也承认了就是念ppt，什么水准我也不想赘述了，反正大学大学大不了自己学。\n\n其他方面，开学时反复强调不签到，期中过后又开始随机签到，前一天晚上反复强调线上小测全是选择，第二天线下发卷子全是大题。我不清楚得和学生有什么仇才会这么喜欢骗学生。\n\n平时话说的很好听，反复强调让大家不要担心，到最后也没看出怎么捞，平时分扣了好多。\n\n小测完全不确定，难度不确定时间不确定形式不确定，测了四次改了四次，二十分钟四道大题共十三道小题什么含金量我不多说了。\n\n我理解你是第一次带学生，那你就把我们当小白鼠随便实验？你给我们一个爆炸的绩点，然后自己过自己的好日子去，这就是老师该有的样子？\n\n总之，选上他的课就赶紧跑吧，不然就是纯给自己添堵。"},{"id":221615,"teacher_id":10246,"teacher_name":"钟先平","post_time":"2025-06-25 02:42:30","like_diff":2,"likes":4,"dislikes":2,"content":"一大坨"},{"id":219847,"teacher_id":10246,"teacher_name":"钟先平","post_time":"2025-06-09 01:56:17","like_diff":1,"likes":1,"dislikes":0,"content":"讲课一般，但人很好。会点名但不计成绩"},{"id":221304,"teacher_id":10246,"teacher_name":"钟先平","post_time":"2025-06-23 00:17:06","like_diff":1,"likes":1,"dislikes":0,"content":"复旦院校代码处打卡"},{"id":222765,"teacher_id":10246,"teacher_name":"钟先平","post_time":"2025-08-18 08:43:57","like_diff":1,"likes":2,"dislikes":1,"content":"讲课水平一般，但是给分还可以\n\n小测是赋分制，题难做不完大家都做不完，最后分都可以赋上去\n\n期末考还有期中考不知道有没有捞\n\n老师就是可能不算特别的优秀，但是也不会坑人，值得一上"},{"id":220995,"teacher_id":10246,"teacher_name":"钟先平","post_time":"2         <!-- 页脚 -->
        <footer class="footer">
            <p>浙江大学教评查询系统 | 数据时效: 2026-01-11</p>
        </footer>
    </div>
    
    <script>
        // 搜索功能
        document.addEventListener('DOMContentLoaded', function() {
            const searchInput = document.getElementById('search-input');
            const searchBtn = document.getElementById('search-btn');
            
            // 搜索按钮点击事件
            if (searchBtn) {
                searchBtn.addEventListener('click', function() {
                    performSearch();
                });
            }
            
            // 搜索框回车事件
            if (searchInput) {
                searchInput.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') {
                        performSearch();
                    }
                });
            }
            
            function performSearch() {
                const query = searchInput.value.trim();
                if (query) {
                    // 跳转到首页并携带搜索参数
                    window.location.href = '../index.html?search=' + encodeURIComponent(query);
                } else {
                    // 如果搜索为空，只跳转到首页
                    window.location.href = '../index.html';
                }
            }
        });
    </script>
</body>
</html>
