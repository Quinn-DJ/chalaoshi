            <div class="teacher-comments">

                    <h3><i class="fas fa-comments"></i> 学生评论 (16 条)</h3>
                    <div class="comments-sort">

                <script>
                    // 评论数据
                    const commentsData = [{"id":145251,"teacher_id":895,"teacher_name":"梁军","post_time":"2021-12-28 13:08:24","like_diff":8,"likes":10,"dislikes":2,"content":"系统论出分前来评价，老师人很好，实力很强，以前一直带研究生。但这门课压根不适合低年级学生学，啥啥都不会，没很强数理基础没法学。课程很硬核，想学有很多东西可学，作为通识课非常费时。平时作业加起来一篇感想，3、4次随堂作业，期末一个大作业一个闭卷考，大作业展示自愿原则，有加分5-8，保底5。我自己花了很多时间，学得很痛苦，希望老师给个好分吧"},{"id":176343,"teacher_id":895,"teacher_name":"梁军","post_time":"2023-06-28 12:55:10","like_diff":6,"likes":6,"dislikes":0,"content":"《运筹学》\n\n本以为会是一门比较硬的课，但是上下来感觉并没有想象中那么偏算法，课后作业布置的也很少，课程最后评分主要就看大作业&随堂考试。\n\n感觉收获没有想象中大，但是给分还算正常"},{"id":144843,"teacher_id":895,"teacher_name":"梁军","post_time":"2021-12-25 05:54:29","like_diff":3,"likes":3,"dislikes":0,"content":"体谅学生，不水"},{"id":157845,"teacher_id":895,"teacher_name":"梁军","post_time":"2022-06-25 05:49:43","like_diff":2,"likes":2,"dislikes":0,"content":"给分真的很求是，或者说感觉给分比求是还差一点……所有运筹学平行班里唯一一个闭卷考还给分差的，大作业给分也很求是（差），讲课很好，只能说能选其他教学班就不要选这个，毕竟课可以智云听……"},{"id":146867,"teacher_id":895,"teacher_name":"梁军","post_time":"2022-01-08 00:14:47","like_diff":1,"likes":2,"dislikes":1,"content":"真的是认真负责的好老师"},{"id":157581,"teacher_id":895,"teacher_name":"梁军","post_time":"2022-06-24 00:36:37","like_diff":1,"likes":2,"dislikes":1,"content":"课是水课，但老师给分又很严格，主要是没有评分细则，主观成分太多了。对了，千万别做他的课代表，那真的是免费打工。"},{"id":158061,"teacher_id":895,"teacher_name":"梁军","post_time":"2022-06-26 13:40:44","like_diff":1,"likes":1,"dislikes":0,"content":"运筹学各种事情比较多，还有思政报告，给分有点奇怪，建议还是选别的班级。不过老师讲课挺好。"},{"id":175998,"teacher_id":895,"teacher_name":"梁军","post_time":"2023-06-27 11:22:55","like_diff":1,"likes":1,"dislikes":0,"content":"如果你是工高的，上的是系统工程。那么他给分是真的好，平时作业做一做，然后布置的讨论做一次，最后考试其实就是五道概念题，最后结果还不错。上90了。"},{"id":30612,"teacher_id":895,"teacher_name":"梁军","post_time":"2016-07-02 04:59:48","like_diff":0,"likes":8,"dislikes":8,"content":"矜矜业业"},{"id":102830,"teacher_id":895,"teacher_name":"梁军","post_time":"2019-02-24 02:14:45","like_diff":0,"likes":7,"dislikes":7,"content":"老师讲课还可以，很认真，但是给的分数好像有点严格啊……"},{"id":144769,"teacher_id":895,"teacher_name":"梁军","post_time":"2021-12-23 13:33:38","like_diff":0,"likes":1,"dislikes":1,"content":"哈哈哈"},{"id":163681,"teacher_id":895,"teacher_name":"梁军","post_time":"2022-12-16 02:51:55","like_diff":0,"likes":0,"dislikes":0,"content":"很敬业"},{"id":197300,"teacher_id":895,"teacher_name":"梁军","post_time":"2024-07-10 13:06:40","like_diff":0,"likes":0,"dislikes":0,"content":"运筹学给分一般（4.2），上课不太能学的到知识，期末小组作业报告+随堂测验，小组作业能抱到大腿就好，比较轻松"},{"id":220153,"teacher_id":895,"teacher_name":"梁军","post_time":"2025-06-29 14:45:32","like_diff":0,"likes":0,"dislikes":0,"content":"讲的比较浅，但还是很生动且清晰。注重思想方法轻计算，作业用ai编程很快，期末考也简单\n\n但是给分很差很差……最高4.5 自己权衡吧"},{"id":222574,"teacher_id":895,"teacher_name":"梁军","post_time":"2025-07-13 15:49:28","like_diff":0,"likes":0,"dislikes":0,"content":"老师给分稍微有点严格，但是其实没有那么严苛。最高分也不止4.5，是有4.8的。来分享下个人感受，我选这门课是因为运筹学很吸引我，上下来也很开心能够对运筹学的体系有一个认知，个人体感不错。任务量应该是适中的，平时作业包括四个章节的编程或解题，第一节课后需撰写一个对运筹学第一章的读书报告，中间穿插了一次思政报告和PPT（每个人都需要撰写，但是会抽5、6个人上去展示），以及最后的大作业。很建议大家写平时作业时认真一些，从朋友反馈来看平时作业分还是很影响的，可以采取一些格式化的东西来写作业（比如从页眉、页码、名称入手，上过数值的人应该比较清楚，就是交作业的规范化思想，感觉老师是一个比较喜欢规整的人），用AI辅助比较方便，但是要记得自己思考一下。与此同时，追求高绩点的同学建议当个组长卷一下，大作业可视化卷一卷，坐前排上课感受挺好还能让老师眼熟（？），期末小测比较基础，但是题量大并且要仔细一点，因为能不能写清楚是另一回事。"},{"id":223989,"teacher_id":895,"teacher_name":"梁军","post_time":"2025-11-02 09:26:20","like_diff":0,"likes":0,"dislikes":0,"content":"很古板，研究生课写个作业只给用word，用latex还要倒扣分"}];
                    
                    // 排序函数
                    function sortComments(sortType) {
                        let sortedComments = [...commentsData];
                        
                        if (sortType === 'popular') {
                            // 按人气排序（点赞减点踩）
                            sortedComments.sort((a, b) => b.like_diff - a.like_diff);
                        } else if (sortType === 'latest') {
                            // 按时间排序（最新在前）
                            sortedComments.sort((a, b) => new Date(b.post_time) - new Date(a.post_time));
                        }
                        
                        return sortedComments;
                    }
                    
                    // 渲染评论列表
                    function renderComments(comments) {
                        const commentsList = document.getElementById('comments-list');
                        commentsList.innerHTML = comments.map(comment => `
                            <div class="comment-item">
                                <div class="comment-meta">
                                    <span class="comment-time">${comment.post_time}</span>
                                    <span class="comment-likes">
                                        <span class="likes"><i class="fas fa-thumbs-up"></i> ${comment.likes}</span>
                                        <span class="dislikes"><i class="fas fa-thumbs-down"></i> ${comment.dislikes}</span>
                                    </span>
                                </div>
                                <div class="comment-content">${comment.content}</div>
                            </div>
                        `).join('');
                    }
                    
                    // 初始化页面
                    document.addEventListener('DOMContentLoaded', function() {
                        // 默认显示人气评论
                        renderComments(sortComments('popular'));
                        
                        // 绑定排序按钮事件
                        document.querySelectorAll('.sort-btn').forEach(btn => {
                            btn.addEventListener('click', function() {
                                // 更新按钮状态
                                document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
                                this.classList.add('active');
                                
                                // 排序并渲染评论
                                const sortType = this.getAttribute('data-sort');
                                renderComments(sortComments(sortType));
                            });
                        });
                    });
                </script>
            </div>
            
        
        <!-- 页脚 -->
        <footer class="footer">
            <p>浙江大学教评查询系统 | 数据时效: 2026-01-11</p>
        </footer>
    </div>
    
    <script>
        // 搜索功能
        document.addEventListener('DOMContentLoaded', function() {
            const searchInput = document.getElementById('search-input');
            const searchBtn = document.getElementById('search-btn');
            
            // 搜索按钮点击事件
            if (searchBtn) {
                searchBtn.addEventListener('click', function() {
                    performSearch();
                });
            }
            
            // 搜索框回车事件
            if (searchInput) {
                searchInput.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') {
                        performSearch();
                    }
                });
            }
            
            function performSearch() {
                const query = searchInput.value.trim();
                if (query) {
                    // 跳转到首页并携带搜索参数
                    window.location.href = '../index.html?search=' + encodeURIComponent(query);
                } else {
                    // 如果搜索为空，只跳转到首页
                    window.location.href = '../index.html';
                }
            }
        });
    </script>
