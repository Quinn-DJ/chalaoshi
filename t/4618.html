好啊，经常和我们聊天"},{"id":175158,"teacher_id":4618,"teacher_name":"袁艺","post_time":"2023-06-22 03:52:30","like_diff":0,"likes":1,"dislikes":1,"content":"老师上课很认真！但是从成绩来看，应该是被正太了"},{"id":195651,"teacher_id":4618,"teacher_name":"袁艺","post_time":"2024-06-29 08:10:34","like_diff":0,"likes":3,"dislikes":3,"content":"老师人很好很好，至于wsc......"},{"id":91879,"teacher_id":4618,"teacher_name":"袁艺","post_time":"2018-12-24 05:46:40","like_diff":-1,"likes":4,"dislikes":5,"content":"水平太低，很多实验里的问题都没办法解释"},{"id":186584,"teacher_id":4618,"teacher_name":"袁艺","post_time":"2024-01-12 02:54:42","like_diff":-1,"likes":3,"dislikes":4,"content":"老师人挺不错的，上课指导得很细心。从期末总评来看也还可以"},{"id":175050,"teacher_id":4618,"teacher_name":"袁艺","post_time":"2023-06-21 09:33:51","like_diff":-2,"likes":0,"dislikes":2,"content":"还行吧"},{"id":186457,"teacher_id":4618,"teacher_name":"袁艺","post_time":"2024-01-11 07:41:39","like_diff":-2,"likes":0,"dislikes":2,"content":"老师人很可爱，给分不咋地\n\nxkc主角改实验报告也抠得很严格\n\n杠就是我菜🥹菜是原罪"},{"id":111826,"teacher_id":4618,"teacher_name":"袁艺","post_time":"2019-07-07 14:49:13","like_diff":-3,"likes":2,"dislikes":5,"content":"老师注重提升学生的分析化学基础，给分好。"},{"id":146376,"teacher_id":4618,"teacher_name":"袁艺","post_time":"2022-01-06 11:25:03","like_diff":-3,"likes":0,"dislikes":3,"content":"老师很好的呀！很有趣！"}];
                    
                    // 排序函数
                    function sortComments(sortType) {
                        let sortedComments = [...commentsData];
                        
                        if (sortType === 'popular') {
                            // 按人气排序（点赞减点踩）
                            sortedComments.sort((a, b) => b.like_diff - a.like_diff);
                        } else if (sortType === 'latest') {
                            // 按时间排序（最新在前）
                            sortedComments.sort((a, b) => new Date(b.post_time) - new Date(a.post_time));
                        }
                        
                        return sortedComments;
                    }
                    
                    // 渲染评论列表
                    function renderComments(comments) {
                        const commentsList = document.getElementById('comments-list');
                        commentsList.innerHTML = comments.map(comment => `

                                <div class="comment-meta">
                                    <span class="comment-time">${comment.post_time}</span>
                                    <span class="comment-likes">

                                        <span class="dislikes"><i class="fas fa-thumbs-down"></i> ${comment.dislikes}</span>
                                    </span>
                                </div>
                                <div class="comment-content">${comment.content}</div>
                            </div>
                        `).join('');
                    }
                    
                    // 初始化页面
                    document.addEventListener('DOMContentLoaded', function() {
                        // 默认显示人气评论
                        renderComments(sortComments('popular'));
                        
                        // 绑定排序按钮事件
                        document.querySelectorAll('.sort-btn').forEach(btn => {
                            btn.addEventListener('click', function() {
                                // 更新按钮状态
                                document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
                                this.classList.add('active');
                                
                                // 排序并渲染评论
                                const sortType = this.getAttribute('data-sort');
                                renderComments(sortComments(sortType));
                            });
                        });
                    });

    <script>

        document.addEventListener('DOMContentLoaded', function() {
            const searchInput = document.getElementById('search-input');
            const searchBtn = document.getElementById('search-btn');
            
            // 搜索按钮点击事件
            if (searchBtn) {
                searchBtn.addEventListener('click', function() {
                    performSearch();
                });
            }
            
            // 搜索框回车事件
            if (searchInput) {
                searchInput.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') {
                        performSearch();
                    }
                });
            }
            
            function performSearch() {
                const query = searchInput.value.trim();
                if (query) {
                    // 跳转到首页并携带搜索参数
                    window.location.href = '../index.html?search=' + encodeURIComponent(query);
                } else {
                    // 如果搜索为空，只跳转到首页
                    window.location.href = '../index.html';
                }
            }
        });
    </script>
