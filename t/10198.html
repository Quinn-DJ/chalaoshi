                    const commentsData = [{"id":200892,"teacher_id":10198,"teacher_name":"张占江","post_time":"2024-10-24 06:22:34","like_diff":28,"likes":29,"dislikes":1,"content":"三节课时可以拿整整一节课来pua你，也是有点无敌了"},{"id":201521,"teacher_id":10198,"teacher_name":"张占江","post_time":"2024-11-04 05:02:05","like_diff":28,"likes":31,"dislikes":3,"content":"可以看看2024年5月17日的智云课堂张某人的课，讲反垄断法经营者集中的。张某人上课时间也就看了100多次手机吧，多次上课中断停下来回复微信｜短信，PPT显然不是张某人做的，读PPT都疙疙瘩瘩，自相矛盾，有头没尾。讲的真的很差，知识点非常单一重复，自我感觉良好，其实也就那么点东西。最喜欢随地大小爹，各种指责学生，但是自己上课水平也就那样。"},{"id":198079,"teacher_id":10198,"teacher_name":"张占江","post_time":"2024-08-28 20:02:30","like_diff":25,"likes":25,"dislikes":0,"content":"有点抽象"},{"id":205028,"teacher_id":10198,"teacher_name":"张占江","post_time":"2024-11-30 03:19:53","like_diff":25,"likes":26,"dislikes":1,"content":"沙壁老登讲座人数不够硬拉学生去凑说算平均分\n\n死吗死罢死全家"},{"id":202892,"teacher_id":10198,"teacher_name":"张占江","post_time":"2024-11-15 04:23:01","like_diff":23,"likes":23,"dislikes":0,"content":"实在是逆天，从来没有见过这么逆天的老师，真绝了"},{"id":205437,"teacher_id":10198,"teacher_name":"张占江","post_time":"2024-12-06 09:11:14","like_diff":15,"likes":15,"dislikes":0,"content":"真的很无语，在非正式的上课时间安排讲座，讲座还签到，以为我们都是闲的没事干吗，你想安排讲座就安排，你想串课就串课。要是正常的上课时间签到也就算了，讲座也签到，真是好东西"},{"id":199763,"teacher_id":10198,"teacher_name":"张占江","post_time":"2024-09-29 06:49:11","like_diff":14,"likes":14,"dislikes":0,"content":"上课穿个大裤衩子，手插兜子里，时不时要拿出手机看一下，也时不时拿起水瓶喝一喝。总之不拿话筒。总之要插兜子。"},{"id":215500,"teacher_id":10198,"teacher_name":"张占江","post_time":"2025-02-27 05:22:56","like_diff":13,"likes":15,"dislikes":2,"content":"法学院最差的老师！最逆天的老师！最恶心的老师！\n\n1.老师虚伪至极，极爱面子，爱虚荣。自己主办的讲座，怕没有学生来听，扫了自己的面子，就把课外的讲座算成平时分，要签到强制学生参加。讲座结束时还当着学生的面撒谎，给嘉宾说：“我们的学生都是自愿来的，没有人要求他们来，没有签到”结果等嘉宾走了，偷偷签到。很难想象，一个大学的教授如此的爱虚荣和虚伪，为了面子，当着所有学生的面撒谎。\n\n2.课程考核方式频繁更改，课程考核成了他的一言堂。高情商：我的课程考核方式灵活多样。低情商：课程考核我说了算，我可以随便更改考核方式。学生到了快期末，甚至都不知道这个课程的总分的组成方式。\n\n3.对课程毫不上心，上课就是车轱辘话反复说，毫无内容可言，上他的课只感觉到了坐牢和痛苦，浪费时间。\n\n4.对教学考试非常不上心，竟然会出现来期末考试不带试卷的错误。到期末考试的那一天了，张老师都到教室了，突然才发现自己没有打印试卷，这才匆忙委托一个同学去打印卷子。任课老师筹备期末考试不准备试卷，到考场上了才临时打印，这难道不是教学事故吗？\n\n5.非常爱pua人，甚至会出现一整节课都在说教人的情况。\n\n6.私自加课时量，他甚至会说：“这一部分内容我在上课就不讲了，在讲座的时候再说”把上课内容强行加到课下的讲座中，强制学生去参加他的讲座，课时量完全不符合规定，他的课下讲座动辄两三小时，后期几乎每周都有。学生需要在上课时间上课之外，还需要抽出课下时间去参加他的讲座，这些都是会签到的哦。学生花了大量的课余时间去参加他的动辄两三小时的讲座，到了期末会加一分的高分。\n\n7.老师口头上说不点名，但实际上在期末交卷时，他让你一个人一个人去交，然后一一比对面熟程度，如果面熟，他就会在卷子上打上记号，证明常来，用面熟程度来点名签到，真的第一次见。\n\n以上是经案的上课体验。\n\n篇幅所限打不下了。\n\n学院的新老师上课，人品，就是这种水平，6了。"},{"id":198934,"teacher_id":10198,"teacher_name":"张占江","post_time":"2024-09-13 06:28:54","like_diff":12,"likes":12,"dislikes":0,"content":"给分真的超级无敌差，差中差。"},{"id":210153,"teacher_id":10198,"teacher_name":"张占江","post_time":"2025-01-08 09:17:17","like_diff":12,"likes":12,"dislikes":0,"content":"前面说拉讲座凑平时分的，数字法学那边玩的更恶心，数字法学研究生必须要听数字法治研究院办的讲座12次，不然不给答辩。而且那个什么研究院的讲座就是一团狗屎，没人听才出这招。只能说入乡随俗了属于是，一群败类！"},{"id":205406,"teacher_id":10198,"teacher_name":"张占江","post_time":"2024-12-06 02:03:27","like_diff":11,"likes":12,"dislikes":1,"content":"脑子有病"},{"id":205477,"teacher_id":10198,"teacher_name":"张占江","post_time":"2024-12-07 10:56:27","like_diff":10,"likes":11,"dislikes":1,"content":"煞笔）"},{"id":205422,"teacher_id":10198,"teacher_name":"张占江","post_time":"2024-12-06 04:32:21","like_diff":9,"likes":9,"dislikes":0,"content":"非常非常抽象。"},{"id":205806,"teacher_id":10198,"teacher_name":"张占江","post_time":"2024-12-12 05:39:58","like_diff":9,"likes":9,"dislikes":0,"content":"二货一个"},{"id":206143,"teacher_id":10198,"teacher_name":"张占江","post_time":"2024-12-13 06:13:27","like_diff":8,"likes":10,"dislikes":2,"content":"上课很烂，翻来覆去地讲，很喜欢随机点名，不到就会扣分。很喜欢pua学生，期末闭卷，要恶竞"},{"id":208349,"teacher_id":10198,"teacher_name":"张占江","post_time":"2024-12-27 03:35:21","like_diff":8,"likes":8,"dislikes":0,"content":"纯sb一个，最后一节课说要考所有讲座内容，每节课必pua学生"},{"id":208511,"teacher_id":10198,"teacher_name":"张占江","post_time":"2024-12-28 15:21:31","like_diff":8,"likes":8,"dislikes":0,"content":"我知道我们法硕学习态度很差，但是用得着这么搞我们吗，我们又不是小学生，什么课该上什么课不该上还是知道的"},{"id":208736,"teacher_id":10198,"teacher_name":"张占江","post_time":"2025-01-01 05:47:22","like_diff":6,"likes":6,"dislikes":0,"content":"还能更低"},{"id":215030,"teacher_id":10198,"teacher_name":"张占江","post_time":"2025-02-20 06:56:35","like_diff":4,"likes":5,"dislikes":1,"content":"怎么有2分，高了。张老师这个水平只能说生在一个好时代，上他的课像折磨，老登事情很多很狗，能不上就不上吧"},{"id":215516,"teacher_id":10198,"teacher_name":"张占江","post_time":"2025-02-27 10:06:08","like_diff":4,"likes":5,"dislikes":1,"content":"狗狗🐶"},{"id":219892,"teacher_id":10198,"teacher_name":"张占江","post_time":"2025-06-10 07:53:20","like_diff":4,"likes":7,"dislikes":3,"content":"感觉老师讲课逻辑挺乱的，上课记笔记的时候没有一次完完整整地吸收知识超过三十分钟，相比其他老师干货比较少；个人感觉老师有点强装和蔼可亲的感觉，实际上mean到离谱哈哈哈哈哈，觉得老师还不错的同学真是被pua到没边了，法学院其实也是有干货+性格魅力的老师，大家还是擦亮双眼叭。"},{"id":222670,"teacher_id":10198,"teacher_name":"张占江","post_time":"2025-07-31 12:13:27","like_diff":4,"likes":6,"dislikes":2,"content":"超傻逼老师啊，搞了个什么“数字竞争法前沿问题”科研训练，其实就是帮他干dirty work，搞什么找文献、翻译文献的活。\n\n最抽象的是之前发通知说参加合格的同学就给科研助理证明，然后话锋一转又是21个人里面挑两个表现好的给证明，这都要鹅颈是吧66666"},{"id":218980,"teacher_id":10198,"teacher_name":"张占江","post_time":"2025-05-16 04:17:19","like_diff":3,"likes":3,"dislikes":0,"content":"听课压力好大"},{"id":209805,"teacher_id":10198,"teacher_name":"张占江","post_time":"2025-01-07 06:49:35","like_diff":2,"likes":3,"dislikes":1,"content":"真的服了 用自己邀请人开的讲座的签到作为我们的平时分 无语至极，本来事情很多还占用我们的下课时间"},{"id":224614,"teacher_id":10198,"teacher_name":"张占江","post_time":"2025-11-25 10:17:43","like_diff":2,"likes":2,"dislikes":0,"content":"没啥好说的，脾气不好的时候就发狠了忘情了"},{"id":224962,"teacher_id":10198,"teacher_name":"张占江","post_time":"2025-12-17 11:36:08","like_diff":2,"likes":2,"dislikes":0,"content":"哥们，你讲课讲成这幅鬼样，还好意思和魏立舟老师比到课率，要点脸吧，随便一个本科生都能看出来你用在上课的心思不足魏老师的万分之一。魏老师从讲课能力到人品，哪一样不比你强，你连魏老师的一根腿毛都比不上！！！"},{"id":223065,"teacher_id":10198,"teacher_name":"张占江","post_time":"2025-09-12 05:23:10","like_diff":1,"likes":2,"dislikes":1,"content":"我艹你嘛，上课如同精神污染，还随机提问，而且讲的也是一坨，提问完把学生晾在那里自己一个劲的输出观点。然后，考完试给分烂到发指，有老哥老姐想不下去课只能看平行班网课求生，纯纯的nt，和隔壁老师比起来真的一个天上一个底下，是我目前为止见过最恶心的法学院老师"},{"id":226024,"teacher_id":10198,"teacher_name":"张占江","post_time":"2026-01-07 01:19:51","like_diff":1,"likes":1,"dislikes":0,"content":"上课大部分时间在显摆自己，剩下的时间在说教别人，完全听不到知识点。举的例子都不知道个经济法有什么关系……什么某教授老夫少妻所以学术做的好啦自己的学生最优秀啦自己浏览擦边视频误触点赞被发现怒斥微信不仁义啦，三观歪到清朝了，自己搞个拼盘课要求还不少，要求学生之前先问问自己有没有教书育人的实力吧。"},{"id":217185,"teacher_id":10198,"teacher_name":"张占江","post_time":"2025-04-03 08:09:52","like_diff":0,"likes":1,"dislikes":1,"content":"法学院这几年招的这几位老师真的是烂完了"},{"id":219001,"teacher_id":10198,"teacher_name":"张占江","post_time":"2025-05-17 15:14:20","like_diff":0,"likes":4,"dislikes":4,"content":"张老师备课很认真，讲课也很有趣！在课上可以发表自己的看法，与老师交流！上的是老师的经济法总论，但是也有机会交流分享实际案例。（虽然点名，但只有3次，而且老师会提前一周通知）真的是一个很好的老师"},{"id":219851,"teacher_id":10198,"teacher_name":"张占江","post_time":"2025-06-09 02:44:52","like_diff":0,"likes":2,"dislikes":2,"content":"老师挺好的，没那么差"},{"id":214724,"teacher_id":10198,"teacher_name":"张占江","post_time":"2025-02-17 06:08:20","like_diff":-1,"likes":3,"dislikes":4,"content":"虽然PUA，但是给分不错"},{"id":220991,"teacher_id":10198,"teacher_name":"张占江","post_time":"2025-06-20 15:07:00","like_diff":-2,"likes":2,"dislikes":4,"content":"老师最后一节课请我们喝奶茶了，老师上课感觉涉及总论和反垄断反不正当竞争法比较多，但是个人感觉不是特别成体系and不好记笔记，期末最后一节课给我们划重点了，明天就要考试了😭希望老师划的重点会考到😭最后一门考试了真的复习不下去了😭"},{"id":224218,"teacher_id":10198,"teacher_name":"张占江","post_time":"2025-11-12 15:27:32","like_diff":-2,"likes":1,"dislikes":3,"content":"感觉没有评论那么差（）经济法上课还是挺有干货的，内容比较易懂容易理解，点名老师现在也会提前通知，最后一节课还请我们喝了奶茶，给分很好，考试也是讲过的东西，好好复习是好好听课有用的。但确实会有一些爹味，喜欢说教"},{"id":216736,"teacher_id":10198,"teacher_name":"张占江","post_time":"2025-03-23 13:22:29","like_diff":-3,"likes":4,"dislikes":7,"content":"没有那么差……给分也可以"},{"id":216737,"teacher_id":10198,"teacher_name":"张占江","post_time":"2025-03-23 13:23:02","like_diff":-3,"likes":4,"dislikes":7,"content":"张老师上课的内容其实很干货，好好停下来是很有收获的，而且老师也是真的关心学生，给分其实也是刀子嘴豆腐心，说的很严格其实打分不错的"},{"id":217736,"teacher_id":10198,"teacher_name":"张占江","post_time":"2025-04-15 16:21:42","like_diff":-6,"likes":2,"dislikes":8,"content":"老师讲课幽默风趣"},{"id":199724,"teacher_id":10198,"teacher_name":"张占江","post_time":"2024-09-28 07:34:04","like_diff":-26,"likes":5,"dislikes":31,"content":"很喜欢张老师，上课的干货很多，有时也会分享自己的经历，个人感觉很有启发。听完这门课对经济法的基础知识有了一定理解，最后只要认真记下要点（特别是期末复习总结，会反复强调），考试应当是没啥大问题的~"}];
                    
                    // 排序函数
                    function sortComments(sortType) {
                        let sortedComments = [...commentsData];
                        
                        if (sortType === 'popular') {
                            // 按人气排序（点赞减点踩）
                            sortedComments.sort((a, b) => b.like_diff - a.like_diff);
                        } else if (sortType === 'latest') {
                            // 按时间排序（最新在前）
                            sortedComments.sort((a, b) => new Date(b.post_time) - new Date(a.post_time));
                        }
                        
                        return sortedComments;
                    }
                    
                    // 渲染评论列表
                    function renderComments(comments) {
                        const commentsList = document.getElementById('comments-list');
                        commentsList.innerHTML = comments.map(comment => `
                            <div class="comment-item">
                                <div class="comment-meta">
                                    <span class="comment-time">${comment.post_time}</span>
                                    <span class="comment-likes">
                                        <span class="likes"><i class="fas fa-thumbs-up"></i> ${comment.likes}</span>
                                        <span class="dislikes"><i class="fas fa-thumbs-down"></i> ${comment.dislikes}</span>
                                    </span>
                                </div>
                                <div class="comment-content">${comment.content}</div>
                            </div>
                        `).join('');
                    }
                    
                    // 初始化页面
                    document.addEventListener('DOMContentLoaded', function() {
                        // 默认显示人气评论
                        renderComments(sortComments('popular'));
                        
                        // 绑定排序按钮事件
                        document.querySelectorAll('.sort-btn').forEach(btn => {
                            btn.addEventListener('click', function() {
                                // 更新按钮状态
                                document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
                                this.classList.add('active');
                                
                                // 排序并渲染评论
                                const sortType = this.getAttribute('data-sort');
                                renderComments(sortComments(sortType));
                            });
                        });
                    });
                </script>
            </div>
            
        
        <!-- 页脚 -->
        <footer class="footer">
            <p>浙江大学教评查询系统 | 数据时效: 2026-01-11</p>
        </footer>
    </div>
    
    <script>
        // 搜索功能
        document.addEventListener('DOMContentLoaded', function() {
            const searchInput = document.getElementById('search-input');
            const searchBtn = document.getElementById('search-btn');
            
            // 搜索按钮点击事件
            if (searchBtn) {
                searchBtn.addEventListener('click', function() {
                    performSearch();
                });
            }
            
            // 搜索框回车事件
            if (searchInput) {
                searchInput.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') {
                        performSearch();
                    }
                });
            }
            
            function performSearch() {
                const query = searchInput.value.trim();
                if (query) {
                    // 跳转到首页并携带搜索参数
                    window.location.href = '../index.html?search=' + encodeURIComponent(query);
                } else {
                    // 如果搜索为空，只跳转到首页
                    window.location.href = '../index.html';
                }
            }
        });
    </script>
