17 03:10:51","like_diff":1,"likes":2,"dislikes":1,"content":"超好的老师！！！可以无脑冲的那种！！！！"},{"id":214835,"teacher_id":10718,"teacher_name":"韦逸","post_time":"2025-02-18 06:41:32","like_diff":1,"likes":1,"dislikes":0,"content":"很自由，给分也好，人也好说话"},{"id":216092,"teacher_id":10718,"teacher_name":"韦逸","post_time":"2025-03-10 09:28:43","like_diff":1,"likes":1,"dislikes":0,"content":"帅，细心，初级班可能有点水，给分还行"},{"id":216473,"teacher_id":10718,"teacher_name":"韦逸","post_time":"2025-03-17 05:44:01","like_diff":1,"likes":1,"dislikes":0,"content":"伟大无须多言"},{"id":219502,"teacher_id":10718,"teacher_name":"韦逸","post_time":"2025-05-29 02:42:33","like_diff":1,"likes":1,"dislikes":0,"content":"伟大！"},{"id":220524,"teacher_id":10718,"teacher_name":"韦逸","post_time":"2025-06-18 11:18:46","like_diff":1,"likes":1,"dislikes":0,"content":"特别特别好的老师！特别有耐心！特别适合初学者，会一对一的跟你讲你的动作问题，然后告诉你要怎么改怎么提升，对于没有基础的同学也会特别耐心的教基础动作，给分也很好"},{"id":220898,"teacher_id":10718,"teacher_name":"韦逸","post_time":"2025-06-20 09:40:06","like_diff":1,"likes":1,"dislikes":0,"content":"超级好的男妈妈，上了俩学期，还是感觉选少了，都给我选他！！！！！！\n\n我体育属于特别差那种，但他上课完全不管你下不下水，测八百一千的时候给了班级n次补考机会，关怀也是满满的，老师前两年还是开班不久没人气，今年再来选的时候已经是要和三百个人抢了哈哈，祝大家都能让他脱衣服下水"},{"id":222529,"teacher_id":10718,"teacher_name":"韦逸","post_time":"2025-07-10 16:57:53","like_diff":1,"likes":1,"dislikes":0,"content":"人帅心善，给分好身材更好"},{"id":224401,"teacher_id":10718,"teacher_name":"韦逸","post_time":"2025-11-19 04:58:01","like_diff":1,"likes":1,"dislikes":0,"content":"很帅帅的老师，身材超级好，一眼看去就知道是游泳的，很帅很温柔，很有耐心"},{"id":225287,"teacher_id":10718,"teacher_name":"韦逸","post_time":"2025-12-21 07:58:48","like_diff":1,"likes":1,"dislikes":0,"content":"大韦哥真的神了！！！"},{"id":209592,"teacher_id":10718,"teacher_name":"韦逸","post_time":"2025-01-06 10:15:18","like_diff":0,"likes":0,"dislikes":0,"content":"老师人很好，给分也很好"},{"id":209676,"teacher_id":10718,"teacher_name":"韦逸","post_time":"2025-01-06 13:36:21","like_diff":0,"likes":0,"dislikes":0,"content":"非常好"},{"id":209735,"teacher_id":10718,"teacher_name":"韦逸","post_time":"2025-01-07 01:58:13","like_diff":0,"likes":0,"dislikes":0,"content":"很好的老师"},{"id":210652,"teacher_id":10718,"teacher_name":"韦逸","post_time":"2025-01-09 14:40:53","like_diff":0,"likes":0,"dislikes":0,"content":"超级好的老师"},{"id":212504,"teacher_id":10718,"teacher_name":"韦逸","post_time":"2025-01-14 05:58:44","like_diff":0,"likes":1,"dislikes":1,"content":"帅 迟到了一个学期没给我记缺勤 完美的帅哥老师"},{"id":212664,"teacher_id":10718,"teacher_name":"韦逸","post_time":"2025-01-14 11:21:25","like_diff":0,"likes":1,"dislikes":1,"content":"人好事少给分捞下课（相对）早，12min简直是放海（跪下）"},{"id":218164,"teacher_id":10718,"teacher_name":"韦逸","post_time":"2025-04-21 17:44:53","like_diff":0,"likes":0,"dislikes":0,"content":"很温柔的老师"},{"id":223880,"teacher_id":10718,"teacher_name":"韦逸","post_time":"2025-10-27 06:02:55","like_diff":0,"likes":0,"dislikes":0,"content":"很温和，迟到也没事"},{"id":225103,"teacher_id":10718,"teacher_name":"韦逸","post_time":"2025-12-19 03:49:37","like_diff":0,"likes":0,"dislikes":0,"content":"10分很真，大家评价的也很真，真的很好的老师"},{"id":225142,"teacher_id":10718,"teacher_name":"韦逸","post_time":"2025-12-19 06:43:53","like_diff":0,"likes":0,"dislikes":0,"content":"老师超级好哇"},{"id":225252,"teacher_id":10718,"teacher_name":"韦逸","post_time":"2025-12-20 13:19:09","like_diff":0,"likes":0,"dislikes":0,"content":"老师特别好，看着很年轻（可以说是满30-10。教得也很好很耐心，很细致。一个学期把小白教会了，但是还是要说，自己的练习也很重要哦！最后，老师真的是男神，帅帅帅！"},{"id":225275,"teacher_id":10718,"teacher_name":"韦逸","post_time":"2025-12-21 04:10:51","like_diff":0,"likes":0,"dislikes":0,"content":"帅，我因为上一节有课赶不过来迟到了一个学期，有时候甚至迟到半个小时也都给签上了，唯一真神"}];
                    
                    // 排序函数
                    function sortComments(sortType) {
                        let sortedComments = [...commentsData];
                        
                        if (sortType === 'popular') {
                            // 按人气排序（点赞减点踩）
                            sortedComments.sort((a, b) => b.like_diff - a.like_diff);
                        } else if (sortType === 'latest') {
                            // 按时间排序（最新在前）
                            sortedComments.sort((a, b) => new Date(b.post_time) - new Date(a.post_time));
                        }
                        
                        return sortedComments;

                                    <span class="comment-time">${comment.post_time}</span>
                                    <span class="comment-likes">
                                        <span class="likes"><i class="fas fa-thumbs-up"></i> ${comment.likes}</span>
                                        <span class="dislikes"><i class="fas fa-thumbs-down"></i> ${comment.dislikes}</span>
                                    </span>
                                </div>
                                <div class="comment-content">${comment.content}</div>
                            </div>
                        `).join('');
                    }
                    
                    // 初始化页面
                    document.addEventListener('DOMContentLoaded', function() {
                        // 默认显示人气评论
                        renderComments(sortComments('popular'));
                        
                        // 绑定排序按钮事件
                        document.querySelectorAll('.sort-btn').forEach(btn => {
                            btn.addEventListener('click', function() {
                                // 更新按钮状态
                                document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
                                this.classList.add('active');
                                
                                // 排序并渲染评论
                                const sortType = this.getAttribute('data-sort');
                                renderComments(sortComments(sortType));
                            });
                        });
                    });
                </script>
            </div>
            
        
        <!-- 页脚 -->
        <footer class="footer">
            <p>浙江大学教评查询系统 | 数据时效: 2026-01-11</p>
        </footer>
    </div>
    
    <script>
        // 搜索功能
        document.addEventListener('DOMContentLoaded', function() {
            const searchInput = document.getElementById('search-input');
            const searchBtn = document.getElementById('search-btn');
            
            // 搜索按钮点击事件
            if (searchBtn) {
                searchBtn.addEventListener('click', function() {
                    performSearch();
                });
            }
            
            // 搜索框回车事件
            if (searchInput) {
                searchInput.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') {
                        performSearch();
                    }
                });
            }
            
            function performSearch() {
                const query = searchInput.value.trim();
                if (query) {
                    // 跳转到首页并携带搜索参数
                    window.location.href = '../index.html?search=' + encodeURIComponent(query);
                } else {
                    // 如果搜索为空，只跳转到首页
                    window.location.href = '../index.html';
                }
            }
        });
    </script>
</body>
</html>
