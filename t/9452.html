"2025-06-24 04:40:36","like_diff":1,"likes":1,"dislikes":0,"content":"陈老师是有机化学授课组里最年轻的老师。老师的风格还是比较风趣幽默的，课堂进度虽然很快，但老师有时会分享几句题外话。\n\n老师课上阶段测试的次数只有两次，小测的时间相比其他几位老师也要宽裕的多，期末给分也很捞。\n\n总体来讲，陈老师的教学和为人都还是很值得称赞的，老师经常上课写板书，也经常笑呵呵的鼓励大家，虽然感觉讲课略显生疏，但毕竟是新老师，相信老师是可以取得进步的！"},{"id":223079,"teacher_id":9452,"teacher_name":"陈洪亮","post_time":"2025-09-12 14:21:48","like_diff":1,"likes":1,"dislikes":0,"content":"陈老师无疑是我大学期间遇到的最负责任的老师了，没有之一，有问必答、回复及时、关心同学，课程思路清晰易于理解，有机虽然很难，但仍然是一段很愉快很幸福的学习经历。"},{"id":223351,"teacher_id":9452,"teacher_name":"陈洪亮","post_time":"2025-09-20 11:23:46","like_diff":0,"likes":0,"dislikes":0,"content":"老师特别好，答疑很耐心"}];
                    
                    // 排序函数
                    function sortComments(sortType) {
                        let sortedComments = [...commentsData];
                        
                        if (sortType === 'popular') {
                            // 按人气排序（点赞减点踩）
                            sortedComments.sort((a, b) => b.like_diff - a.like_diff);
                        } else if (sortType === 'latest') {
                            // 按时间排序（最新在前）
                            sortedComments.sort((a, b) => new Date(b.post_time) - new Date(a.post_time));
                        }
                        
                        return sortedComments;
                    }
                    
                    // 渲染评论列表
                    function renderComments(comments) {
                        const commentsList = document.getElementById('comments-list');
                        commentsList.innerHTML = comments.map(comment => `
                            <div class="comment-item">
                                <div class="comment-meta">
                                    <span class="comment-time">${comment.post_time}</span>
                                    <span class="comment-likes">

                                    </span>
                                </div>
                                <div class="comment-content">${comment.content}</div>
                            </div>
                        `).join('');
                    }
                    
                    // 初始化页面
                    document.addEventListener('DOMContentLoaded', function() {
                        // 默认显示人气评论
                        renderComments(sortComments('popular'));
                        
                        // 绑定排序按钮事件
                        document.querySelectorAll('.sort-btn').forEach(btn => {

                                // 更新按钮状态
                                document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
                                this.classList.add('active');
                                
                                // 排序并渲染评论

    <script>
        // 搜索功能
        document.addEventListener('DOMContentLoaded', function() {
            const searchInput = document.getElementById('search-input');
            const searchBtn = document.getElementById('search-btn');
            
            // 搜索按钮点击事件
            if (searchBtn) {
                searchBtn.addEventListener('click', function() {
                    performSearch();
                });
            }
            
            // 搜索框回车事件
            if (searchInput) {
                searchInput.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') {
                        performSearch();
                    }
                });
            }
            
            function performSearch() {
                const query = searchInput.value.trim();
                if (query) {
                    // 跳转到首页并携带搜索参数
                    window.location.href = '../index.html?search=' + encodeURIComponent(query);
                } else {
                    // 如果搜索为空，只跳转到首页
                    window.location.href = '../index.html';
                }
            }
        });
    </script>
