                <script>
                    // 评论数据
                    const commentsData = [{"id":200415,"teacher_id":10701,"teacher_name":"沈黎勇","post_time":"2024-10-17 01:04:14","like_diff":16,"likes":20,"dislikes":4,"content":"感觉还可以，就是上课不让吃早餐，8分吧"},{"id":205370,"teacher_id":10701,"teacher_name":"沈黎勇","post_time":"2024-12-05 07:08:37","like_diff":9,"likes":10,"dislikes":1,"content":"老师很爱笑哈，朝气蓬勃的中年人给活人微死的青年人上课有种带不动的搞笑感。\n\n老师人是真的有种赤诚的感觉，特别是他讲汶川大地震他带着学生去汶川找家人的时候，人性的光辉快闪瞎我。\n\nHowever，职规课属于认真听绝对会被气死的课，因为知识太陈旧了，而且老师有意无意地鼓励优绩主义；在被气死之前还会很焦虑，特别是人文社科的，恨不得赶紧转个啥环化材生能源工信，整点什么项目成果出来助力社会发展，不然你在就业市场上就岌岌可危辣。。。\n\n满绩了，谢谢老师，老师人很好，很阳光，但是课just so so。\n\n想拿高分的同学记得认真写作业，用ai没关系，但要做出差异化。"},{"id":202257,"teacher_id":10701,"teacher_name":"沈黎勇","post_time":"2024-11-11 04:49:52","like_diff":8,"likes":9,"dislikes":1,"content":"平常事情比较多，期末事情少，平常也很少点名，沈老师人真的不错。就是职规课有一点点无聊，像初高中心理课"},{"id":203916,"teacher_id":10701,"teacher_name":"沈黎勇","post_time":"2024-11-22 03:47:48","like_diff":7,"likes":7,"dislikes":0,"content":"偶尔随机抽人回答问题，其他不点名。个人不是非常喜欢老师的上课方式，感觉可能过多注重分享老师的经历而略少理论知识的分享（比如一份简历应该注重哪些，一次面试应该注重哪些。这些我会比较希望听到），不过职规课可能也很难讲出什么花来……事不算很多，期末只用pre不用拍小短剧不用演情景剧我可太感谢了。\n\n不过老师的给分很好！全程上课没发言没上台只是在角落摸鱼，作业虽然算是认真完成但也没有被作为优秀作业推荐过，期末也只是在小组里服从小组安排打打杂工。本来预计能上4就很好了，结果最后老师给的分超出想象的好👍大赞！"},{"id":201783,"teacher_id":10701,"teacher_name":"沈黎勇","post_time":"2024-11-06 08:38:59","like_diff":5,"likes":5,"dislikes":0,"content":"老师人真的很好，我觉得上他的课其实蛮有用的，超鼓励人（虽然我真的不喜欢被鼓励），推荐职规"},{"id":204150,"teacher_id":10701,"teacher_name":"沈黎勇","post_time":"2024-11-24 17:00:49","like_diff":5,"likes":6,"dislikes":1,"content":"沈老师比较关心学生，上课也比较认真负责，经常笑眯眯的；而且给分好！"},{"id":210733,"teacher_id":10701,"teacher_name":"沈黎勇","post_time":"2025-01-10 01:31:13","like_diff":5,"likes":6,"dislikes":1,"content":"老师人真的很好  上课非常用心  每一个人的发言都会认真点评  生病了也坚持上课 \n\n\n\n但毕竟是思政课  大家都不怎么听  也是很悲哀吧  上课的时候总是叫大家头抬一下\n\n\n\n给分还是不错的  我是他和fll的班  没有种地直接给了我们那分  小组作业也会自己分配百分比"},{"id":210772,"teacher_id":10701,"teacher_name":"沈黎勇","post_time":"2025-01-10 02:33:48","like_diff":5,"likes":6,"dislikes":1,"content":"老师真的是很真诚很温暖的人 \n\n虽然思政大家都在干自己的事但是偶尔听听沈老师的积极的话还是很正能量 \n\n给分比想象中的好？志愿者只做过一次 小组作业没有太大贡献水过去的 高中选考政治期末第一次翻书最后4.5 让我们说谢谢sly\n\nps老师经常点名 记得要来上课啊"},{"id":201260,"teacher_id":10701,"teacher_name":"沈黎勇","post_time":"2024-10-31 01:39:53","like_diff":4,"likes":5,"dislikes":1,"content":"很好的老师呢，真的很认真的备了课，但是奈何这堂课的性质真的很难让人全程认真地听下去。"},{"id":203839,"teacher_id":10701,"teacher_name":"沈黎勇","post_time":"2024-11-21 12:02:57","like_diff":3,"likes":3,"dislikes":0,"content":"不点名，话比较多，给分好"},{"id":210242,"teacher_id":10701,"teacher_name":"沈黎勇","post_time":"2025-01-08 13:59:21","like_diff":3,"likes":5,"dislikes":2,"content":"上的德法课。老师很好，很慈祥笑呵呵的，而且上课也很用心，备课也很用心。问题是这门课程的性质真的让人很难认真地听下去。老师后来似乎发觉不论如何我们都懒得听，所以渐渐的也不太管我们了。挺悲哀的，老师在用上个世纪激情的余热试图唤醒当代学生，但大家早就在应试体系里死过一次了。"},{"id":210749,"teacher_id":10701,"teacher_name":"沈黎勇","post_time":"2025-01-10 01:55:12","like_diff":3,"likes":3,"dislikes":0,"content":"给分很求是，上课不让玩手机"},{"id":201785,"teacher_id":10701,"teacher_name":"沈黎勇","post_time":"2024-11-06 09:16:52","like_diff":2,"likes":2,"dislikes":0,"content":"我爱沈老师！"},{"id":204494,"teacher_id":10701,"teacher_name":"沈黎勇","post_time":"2024-11-26 08:12:00","like_diff":2,"likes":3,"dislikes":1,"content":"首先，平时作业我觉得真的不多，对比其他的职规老师很少了，就几个基本作业，字数也不多。上课也不错，课程本身就无聊，老师已经尽力上的很有趣了。人也很好，非常温和没有架子。期末作业也是事情最少的，基础的pre就可以了。给分友好，反正我微微卷了一下期末作业（按照提供的模板结构完成，弄一些组图插图。课堂上每次写一点课后做一点）就满绩了。但是作业形式还是要注重一下，做得漂亮一些确实分数更可观。"},{"id":209623,"teacher_id":10701,"teacher_name":"沈黎勇","post_time":"2025-01-10 02:34:49","like_diff":2,"likes":3,"dislikes":1,"content":"事少给分好，还非常会鼓励人，神老师！"},{"id":212040,"teacher_id":10701,"teacher_name":"沈黎勇","post_time":"2025-01-13 05:32:41","like_diff":2,"likes":2,"dislikes":0,"content":"特别好的老师！！！！！"},{"id":212055,"teacher_id":10701,"teacher_name":"沈黎勇","post_time":"2025-01-13 06:09:03","like_diff":2,"likes":2,"dislikes":0,"content":"给分比较求是 平时事情不算多，三次小作业 一次期末大作业和展示，只要最好展示和职规书好好准备绩点不会差的，算比较负责的老师"},{"id":205715,"teacher_id":10701,"teacher_name":"沈黎勇","post_time":"2024-12-11 11:53:52","like_diff":1,"likes":3,"dislikes":2,"content":"老师超鼓励人（但我不是很喜欢被鼓励），不影响，老师很愿意和我们分享经验，也很愿意私下跟我们交流。有些关于面试简历的问题都可以找他，我觉得老师很好"},{"id":210241,"teacher_id":10701,"teacher_name":"沈黎勇","post_time":"2025-01-10 10:14:22","like_diff":1,"likes":2,"dislikes":1,"content":"挺好的老师，就是有点无聊"},{"id":212974,"teacher_id":10701,"teacher_name":"沈黎勇","post_time":"2025-01-15 11:35:48","like_diff":0,"likes":1,"dislikes":1,"content":"作业比较少，给分比较高"},{"id":213124,"teacher_id":10701,"teacher_name":"沈黎勇","post_time":"2025-01-16 04:55:08","like_diff":0,"likes":0,"dislikes":0,"content":"职规，最后一波1.5学分的职规\n\n职规事情一向多，大概除了职业生涯规划书还有两三次其他的作业，上课没怎么听过。\n\n给分也挺好的，毕竟职业生涯规划书是我一个字一个字敲出来的。"},{"id":214953,"teacher_id":10701,"teacher_name":"沈黎勇","post_time":"2025-02-19 09:22:48","like_diff":0,"likes":0,"dislikes":0,"content":"备课认真，上课敬业、富有激情，态度和蔼可亲，对学生比较关心，是一位称职的老师。"},{"id":223814,"teacher_id":10701,"teacher_name":"沈黎勇","post_time":"2025-10-21 14:57:00","like_diff":0,"likes":0,"dislikes":0,"content":"虽然是水课，但是沈黎勇老师真的把思政课上活了，老师经历非常丰富，上课会举自己亲身经历的或浙大相关的事件，唯一一节从不犯困的思政课。老师也很亲近学生，课间还会和同学交流关心同学。总之选上了他的课真的是太幸运了！"},{"id":200859,"teacher_id":10701,"teacher_name":"沈黎勇","post_time":"2024-10-23 12:53:17","like_diff":-1,"likes":1,"dislikes":2,"content":"，，，"},{"id":210832,"teacher_id":10701,"teacher_name":"沈黎勇","post_time":"2025-01-10 04:52:00","like_diff":-3,"likes":9,"dislikes":12,"content":"纯纯cs，纯纯cs，纯纯cs，重要的事情说三遍。\n\n作为思政老师，连道德底线都没有，就是一副既得利益者的丑态。24年下半年学校曝出很多事情，它居然给方能洗白，还说方能是那么优秀的学生，称在98上伸张正义的学生惹是生非，要求我们所谓的维护学校形象……\n\n而他，丝毫不关心学生，明明是早八的课，却以早点到教室为荣，甚至宣扬提早一小时到教室的极致的病态行为！！！"}];
                    
                    // 排序函数
                    function sortComments(sortType) {
                        let sortedComments = [...commentsData];
                        
                        if (sortType === 'popular') {
                            // 按人气排序（点赞减点踩）
                            sortedComments.sort((a, b) => b.like_diff - a.like_diff);
                        } else if (sortType === 'latest') {
                            // 按时间排序（最新在前）
                            sortedComments.sort((a, b) => new Date(b.post_time) - new Date(a.post_time));
                        }
                        
                        return sortedComments;
                    }
                    
                    // 渲染评论列表
                    function renderComments(comments) {
                        const commentsList = document.getElementById('comments-list');
                        commentsList.innerHTML = comments.map(comment => `
                            <div class="comment-item">
                                <div class="comment-meta">
                                    <span class="comment-time">${comment.post_time}</span>
                                    <span class="comment-likes">
                                        <span class="likes"><i class="fas fa-thumbs-up"></i> ${comment.likes}</span>
                                        <span class="dislikes"><i class="fas fa-thumbs-down"></i> ${comment.dislikes}</span>
                                    </span>
                                </div>
                                <div class="comment-content">${comment.content}</div>
                            </div>
                        `).join('');
                    }
                    
                    // 初始化页面
                    document.addEventListener('DOMContentLoaded', function() {
                        // 默认显示人气评论
                        renderComments(sortComments('popular'));
                        
                        // 绑定排序按钮事件
                        document.querySelectorAll('.sort-btn').forEach(btn => {
                            btn.addEventListener('click', function() {
                                // 更新按钮状态
                                document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
                                this.classList.add('active');
                                
                                // 排序并渲染评论
                                const sortType = this.getAttribute('data-sort');
                                renderComments(sortComments(sortType));
                            });
                        });
                    });
                </script>
            </div>
            
        
        <!-- 页脚 -->
        <footer class="footer">
            <p>浙江大学教评查询系统 | 数据时效: 2026-01-11</p>
        </footer>
    </div>
    
    <script>
        // 搜索功能
        document.addEventListener('DOMContentLoaded', function() {
            const searchInput = document.getElementById('search-input');
            const searchBtn = document.getElementById('search-btn');
            
            // 搜索按钮点击事件
            if (searchBtn) {
                searchBtn.addEventListener('click', function() {
                    performSearch();
                });
            }
            
            // 搜索框回车事件
            if (searchInput) {
                searchInput.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') {
                        performSearch();
                    }
                });
            }
            
            function performSearch() {
                const query = searchInput.value.trim();
                if (query) {
                    // 跳转到首页并携带搜索参数
                    window.location.href = '../index.html?search=' + encodeURIComponent(query);
                } else {
                    // 如果搜索为空，只跳转到首页
                    window.location.href = '../index.html';
                }
            }
        });
    </script>
