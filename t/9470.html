        <!-- 学生评论 -->

                <script>
                    // 评论数据
                    const commentsData = [{"id":169203,"teacher_id":9470,"teacher_name":"赵志荣","post_time":"2023-02-24 15:42:41","like_diff":8,"likes":12,"dislikes":4,"content":"Jerry大院长终于有自己的查老师主页了哈哈哈，作为小迷妹，首先10分送上\n\n    客观评价赵院长课程的缺点：事多（一周两次作业你敢信），课硬，给分一般（我当时上这门课花了很多功夫，最后4.2，与之相对应我自己大部分专业课都4.5，4.8）。\n\n    优点也很明显：老师学识渊博，很关心学生又精力充沛，上这门课确实能学到很多。助教ssy姐姐也很友善。\n\n    我自己是冲着赵大院长的推荐信来的，也对这门课的硬核程度早有预期，所以我自己的上课体验还是蛮愉快的。要选课的各位可以结合自己的情况妥善考虑。"},{"id":193598,"teacher_id":9470,"teacher_name":"赵志荣","post_time":"2024-06-13 11:47:35","like_diff":6,"likes":6,"dislikes":0,"content":"大院长人很好，课讲得也好，公共部门财务管理学的内容简单，0基础完全没问题"},{"id":218803,"teacher_id":9470,"teacher_name":"赵志荣","post_time":"2025-05-06 07:21:54","like_diff":5,"likes":5,"dislikes":0,"content":"赵老师的课程深入浅出，有大家风范，内容也很充实能学到很多。助教zkx姐姐特别友善！"},{"id":218804,"teacher_id":9470,"teacher_name":"赵志荣","post_time":"2025-05-06 07:24:07","like_diff":5,"likes":5,"dislikes":0,"content":"赵教授知识渊博，授课非常认真，课堂上互动挺多的，讲课清晰易懂，上他的课能学到很多知识，强烈推荐！"},{"id":193757,"teacher_id":9470,"teacher_name":"赵志荣","post_time":"2024-06-17 14:26:56","like_diff":4,"likes":5,"dislikes":1,"content":"事多，课不硬，总体体验很好，给赵老师10分"},{"id":218952,"teacher_id":9470,"teacher_name":"赵志荣","post_time":"2025-05-15 02:39:08","like_diff":4,"likes":4,"dislikes":0,"content":"课程内容丰富，老师富有人格魅力"},{"id":219031,"teacher_id":9470,"teacher_name":"赵志荣","post_time":"2025-05-19 09:54:46","like_diff":4,"likes":4,"dislikes":0,"content":"千教万教，教人求真"},{"id":219876,"teacher_id":9470,"teacher_name":"赵志荣","post_time":"2025-06-09 13:23:12","like_diff":2,"likes":2,"dislikes":0,"content":"有情怀的公共管理大师"},{"id":220359,"teacher_id":9470,"teacher_name":"赵志荣","post_time":"2025-06-17 13:02:37","like_diff":2,"likes":2,"dislikes":0,"content":"《公共财政和预算》\n\n听力+口语全废选手为了毕业不得不选了这么课呜呜呜\n\n赵老师和助教老师都很有耐心，能看出海底大捞了\n\n\n\n期末总分100分，考核如下：\n\n1.预算10分，大概第三周提交一份个人有关于预算的memo，2页；\n\n2.收入30分，小组合作\n\n3.支出25分，个人作业，需要2分钟闪电演讲，之后有一周时间修改并提交8-10页memo\n\n4.课堂参与15分，平时课后需要提交与本周课程memo，一般一页就够了，不确定出勤情况是怎么算的；\n\n5.期末开卷考20分，可用电脑"},{"id":223426,"teacher_id":9470,"teacher_name":"赵志荣","post_time":"2025-09-23 10:56:40","like_diff":2,"likes":2,"dislikes":0,"content":"老师逻辑思维特别清晰，很难被我们绕进去！"},{"id":223907,"teacher_id":9470,"teacher_name":"赵志荣","post_time":"2025-10-29 05:37:21","like_diff":0,"likes":0,"dislikes":0,"content":"很有热情的老师，很可爱"}];
                    
                    // 排序函数
                    function sortComments(sortType) {
                        let sortedComments = [...commentsData];
                        
                        if (sortType === 'popular') {
                            // 按人气排序（点赞减点踩）
                            sortedComments.sort((a, b) => b.like_diff - a.like_diff);
                        } else if (sortType === 'latest') {
                            // 按时间排序（最新在前）
                            sortedComments.sort((a, b) => new Date(b.post_time) - new Date(a.post_time));
                        }
                        
                        return sortedComments;
                    }
                    
                    // 渲染评论列表
                    function renderComments(comments) {
                        const commentsList = document.getElementById('comments-list');
                        commentsList.innerHTML = comments.map(comment => `

                                    </span>
                                </div>
                                <div class="comment-content">${comment.content}</div>
                            </div>
                        `).join('');
                    }
                    
                    // 初始化页面
                    document.addEventListener('DOMContentLoaded', function() {
                        // 默认显示人气评论
                        renderComments(sortComments('popular'));
                        
                        // 绑定排序按钮事件
                        document.querySelectorAll('.sort-btn').forEach(btn => {

                                // 更新按钮状态
                                document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
                                this.classList.add('active');
                                
                                // 排序并渲染评论
                                const sortType = this.getAttribute('data-sort');
                                renderComments(sortComments(sortType));
                            });
                        });
                    });

    <script>
        // 搜索功能
        document.addEventListener('DOMContentLoaded', function() {
            const searchInput = document.getElementById('search-input');
            const searchBtn = document.getElementById('search-btn');
            
            // 搜索按钮点击事件
            if (searchBtn) {
                searchBtn.addEventListener('click', function() {
                    performSearch();
                });
            }
            
            // 搜索框回车事件
            if (searchInput) {
                searchInput.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') {
                        performSearch();
                    }
                });
            }
            
            function performSearch() {
                const query = searchInput.value.trim();
                if (query) {
                    // 跳转到首页并携带搜索参数
                    window.location.href = '../index.html?search=' + encodeURIComponent(query);
                } else {
                    // 如果搜索为空，只跳转到首页
                    window.location.href = '../index.html';
                }
            }
        });
    </script>
