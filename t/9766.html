                <script>
                    // 评论数据
                    const commentsData = [{"id":190005,"teacher_id":9766,"teacher_name":"朱霖潮","post_time":"2024-02-08 08:05:51","like_diff":11,"likes":11,"dislikes":0,"content":"老师讲课不错，也很用心。他讲课可能不是很久，所以他希望上课的同学可以多多互动反馈一下教学情况，对于发言的同学有小零食奖励，总之是不错的老师"},{"id":222241,"teacher_id":9766,"teacher_name":"朱霖潮","post_time":"2025-07-01 15:09:28","like_diff":10,"likes":10,"dislikes":0,"content":"神中神\n\n听过其他老师的智云，AI(A)这门课还得是计院的老师讲得清楚。老师教学很认真，上课会奖励回答问题的同学小零食。不点名，但有全开卷且可使用电子设备的小测作为点名。\n\n朱老师对教学非常上心，开学前有发问卷调查，上课时会问大家能不能跟得上，课间、课后也会问大家对于这节课的看法。\n\n对于人工智能基础A臭名昭著的七个作业，老师给的时间很长，且对于部分作业有所削弱。大作业是朱老师针对班级里专业比较多的同学亲自出的题，比如我们班土建多，出的题目就是分类混凝土有无裂纹，整体代码都写好了，不难。\n\n最后给分很棒，很捞。\n\n虽然但是，这门课还有很大的优化空间。说难听点，现在仍然是一门矢课。（不针对朱老师）"},{"id":189573,"teacher_id":9766,"teacher_name":"朱霖潮","post_time":"2024-01-25 12:28:27","like_diff":4,"likes":4,"dislikes":0,"content":"ai导课程，老师讲的很清楚，质量很好有求必应。ps：上课掉落零食，睡觉也发（"},{"id":206235,"teacher_id":9766,"teacher_name":"朱霖潮","post_time":"2024-12-13 10:08:34","like_diff":4,"likes":4,"dislikes":0,"content":"讲的太好了"},{"id":221156,"teacher_id":9766,"teacher_name":"朱霖潮","post_time":"2025-06-21 14:07:54","like_diff":4,"likes":4,"dislikes":0,"content":"分数还没出，我只想说人基（A）这门课就是答辩，答辩中的答辩\n\n不过zlc老师人还是很好的，虽然我没听课但是能感受出他讲课讲得也很好，而且会积极地和同学们互动，同时倾听同学们的学习情况，总体来说是一个年轻有活力、很不错的老师。\n\n最后希望期末考能捞捞我orz"},{"id":222002,"teacher_id":9766,"teacher_name":"朱霖潮","post_time":"2025-06-28 13:07:20","like_diff":3,"likes":3,"dislikes":0,"content":"人基A这门课本身存在设计问题，上课对于代码讲解时间有限，有的lab难度很高，有的要很多截图比较繁琐，比较考察AI的运用能力(doge)，期末闭卷ppt重点也没有完全覆盖，而且是比较难的。但是，抛开这些问题不谈，朱老师是非常好的一位老师，人长得帅，也经常投喂小零食来活跃课堂气氛，上课也是很有趣的，专业也对口，对于同学的发言总是有积极的反馈，最后给分也还是比较捞的。我认为老师完全值得一个10分，希望老师能够让人基A这门课变得更好，让以后的同学能以学人基A为乐趣，而非痛苦。感谢老师!"},{"id":216823,"teacher_id":9766,"teacher_name":"朱霖潮","post_time":"2025-03-26 07:11:29","like_diff":2,"likes":4,"dislikes":2,"content":"“**我已经管得足够宽了，你用任何工具我都不管你”\n\n“不不不，我不是这个意思，不能使用旁边的（停顿）智能体，至少不要影响旁边同学。。。”"},{"id":221952,"teacher_id":9766,"teacher_name":"朱霖潮","post_time":"2025-06-27 15:49:29","like_diff":2,"likes":2,"dislikes":0,"content":"非常好的老师"},{"id":181375,"teacher_id":9766,"teacher_name":"朱霖潮","post_time":"2023-10-16 05:35:31","like_diff":1,"likes":2,"dislikes":1,"content":"讲得还蛮清楚"},{"id":182754,"teacher_id":9766,"teacher_name":"朱霖潮","post_time":"2023-11-20 05:31:16","like_diff":1,"likes":1,"dislikes":0,"content":"讲课很好"},{"id":214998,"teacher_id":9766,"teacher_name":"朱霖潮","post_time":"2025-02-20 03:25:43","like_diff":1,"likes":1,"dislikes":0,"content":"人基（A）老师很年轻活力，讲课特别有激情，而且很多时候能预判到学生的想法和需求，在讲课有很对实验的时候马上和我们说不用怕，都是一些很简单易完成的小任务。课堂也特别宽松“觉得能学到东西的那你就来，如果觉得没意思也可以不来做其他事”\n\nPs：回答问题随机掉落小零食"},{"id":223684,"teacher_id":9766,"teacher_name":"朱霖潮","post_time":"2025-10-13 06:44:54","like_diff":-5,"likes":0,"dislikes":5,"content":"人还可以 但是讲课水平真的有点难评"}];
                    
                    // 排序函数
                    function sortComments(sortType) {
                        let sortedComments = [...commentsData];
                        
                        if (sortType === 'popular') {
                            // 按人气排序（点赞减点踩）
                            sortedComments.sort((a, b) => b.like_diff - a.like_diff);
                        } else if (sortType === 'latest') {
                            // 按时间排序（最新在前）
                            sortedComments.sort((a, b) => new Date(b.post_time) - new Date(a.post_time));
                        }
                        
                        return sortedComments;
                    }
                    
                    // 渲染评论列表
                    function renderComments(comments) {
                        const commentsList = document.getElementById('comments-list');
                        commentsList.innerHTML = comments.map(comment => `
                            <div class="comment-item">
                                <div class="comment-meta">
                                    <span class="comment-time">${comment.post_time}</span>
                                    <span class="comment-likes">
                                        <span class="likes"><i class="fas fa-thumbs-up"></i> ${comment.likes}</span>
                                        <span class="dislikes"><i class="fas fa-thumbs-down"></i> ${comment.dislikes}</span>
                                    </span>
                                </div>
                                <div class="comment-content">${comment.content}</div>
                            </div>
                        `).join('');
                    }
                    
                    // 初始化页面
                    document.addEventListener('DOMContentLoaded', function() {
                        // 默认显示人气评论
                        renderComments(sortComments('popular'));
                        
                        // 绑定排序按钮事件
                        document.querySelectorAll('.sort-btn').forEach(btn => {
                            btn.addEventListener('click', function() {
                                // 更新按钮状态
                                document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
                                this.classList.add('active');
                                
                                // 排序并渲染评论
                                const sortType = this.getAttribute('data-sort');
                                renderComments(sortComments(sortType));
                            });
                        });
                    });
                </script>

    <script>
        // 搜索功能
        document.addEventListener('DOMContentLoaded', function() {
            const searchInput = document.getElementById('search-input');
            const searchBtn = document.getElementById('search-btn');
            
            // 搜索按钮点击事件
            if (searchBtn) {
                searchBtn.addEventListener('click', function() {
                    performSearch();
                });
            }
            
            // 搜索框回车事件
            if (searchInput) {
                searchInput.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') {
                        performSearch();
                    }
                });
            }
            
            function performSearch() {
                const query = searchInput.value.trim();
                if (query) {
                    // 跳转到首页并携带搜索参数
                    window.location.href = '../index.html?search=' + encodeURIComponent(query);
                } else {
                    // 如果搜索为空，只跳转到首页
                    window.location.href = '../index.html';
                }
            }
        });
    </script>
