评论过别人。当然，客观来讲，我跟他接触也是她博士毕业一段时间以后了，那段差评其实讲的言辞听恳切的，不像是编故事。有可能她的人品在博士前后有发生了巨大改变，所以我还是尊重下那位同学的差评。事情真相出来之前，不置可否。"},{"id":224939,"teacher_id":10372,"teacher_name":"陈飘飘","post_time":"2025-12-15 18:27:22","like_diff":2,"likes":2,"dislikes":0,"content":"陈飘飘就是崇洋媚外的人，天天在实验室和我说国外各种方面好，浙大给你年薪40多万，住房补贴一年10万，母校给你的福利和待遇还不够嘛？你还还天天吃里扒外，压榨我们实验室的学生，见利忘义的人！"},{"id":199262,"teacher_id":10372,"teacher_name":"陈飘飘","post_time":"2024-09-20 05:27:23","like_diff":1,"likes":27,"dislikes":26,"content":"首先很不理解楼下的差评，怎么都感觉是在刻意摸黑呢？\n\n鄙人有幸听过陈老师的报告，逻辑清晰，思路明确，通俗易懂。\n\n各位同学们有机会可以上一上陈老师的课，或者听一听她的汇报，实际体会一下。\n\n实践是检验真理的唯一标准。"},{"id":219834,"teacher_id":10372,"teacher_name":"陈飘飘","post_time":"2025-06-08 11:39:37","like_diff":0,"likes":14,"dislikes":14,"content":"支持陈老师。这里是浙大学生评价课程的平台，不是村口长舌妇是是非非的宫斗场所。你师兄只因为她在导师面前“上眼药”就辞职了？一个博士生，能厉害到三言两语搞辞职一个博后？好小众的情况。如果真这样陈老师在浙大可是太屈才了，该去搞政治。\n\n\n\n没人想听你们组里这些宫斗旧事，哪个课题组没有人际糊涂账？以后是不是浙大男老师分手之后前女友要上查老师来爆料他不洗袜子？大家的眼睛都是雪亮的。浙大的老师由浙大的学生评价。请还查老师一个清净真实。"},{"id":199261,"teacher_id":10372,"teacher_name":"陈飘飘","post_time":"2024-09-20 05:18:05","like_diff":-2,"likes":23,"dislikes":25,"content":"体验很好，老师会考虑到学生的接受能力，循循善诱，老师人很和善，很好说话！"},{"id":199424,"teacher_id":10372,"teacher_name":"陈飘飘","post_time":"2024-09-23 08:57:49","like_diff":-3,"likes":19,"dislikes":22,"content":"这些争论其实没有什么意义，我只能说每个人有不同的立场，难以辩驳留下一大段文字的目的是什么，如果真的想了解陈老师可以去听听她的讲座或者和她的学生抑或是她本人交流，多说无益"},{"id":199646,"teacher_id":10372,"teacher_name":"陈飘飘","post_time":"2024-09-26 19:43:48","like_diff":-3,"likes":19,"dislikes":22,"content":"那个说陈师姐博士经历的人我都不知道他到底是不是中大的。我跟陈师姐在同一个实验室，一起待了至少4年，中间只招过一个博后，跟陈师姐课题都没交集，倒是跟我做同一个课题，人家好好的去兰大当老师了，不知道他说的把博后挤走是哪个博后。PS:10点前不许起走到因为要一起去小北门吃宵夜吗？😄"},{"id":199259,"teacher_id":10372,"teacher_name":"陈飘飘","post_time":"2024-09-20 05:03:42","like_diff":-4,"likes":22,"dislikes":26,"content":"飘飘老师是我在浙大遇到的特别好的老师，老师性格超级好，很有耐心，而且很多事情都亲力亲为，和学生也没有代沟😭😭😭真的很感激在重要的人生节点遇到了飘飘老师🥺🥺"},{"id":199644,"teacher_id":10372,"teacher_name":"陈飘飘","post_time":"2024-09-26 15:58:47","like_diff":-4,"likes":18,"dislikes":22,"content":"跟着陈老师后面学习一段时间，真的是非常好的一位老师，也和她身边的老师同学有过接触，都是一致好评。不知道下面大段用繁体字编造故事的是什么成分，遣词造句还挺有特点。建议对陈老师研究方向感兴趣的同学可以听一听她的报告，或者找机会和陈老师交流一下，不要被片面之词给误导了。"},{"id":199429,"teacher_id":10372,"teacher_name":"陈飘飘","post_time":"2024-09-23 09:29:19","like_diff":-5,"likes":17,"dislikes":22,"content":"有幸听过陈老师几次报告，也有一些交流，能感觉到陈老师非常友好和善，而且能感受到她思维敏捷，富有创造力，是一个非常有想法的老师。"},{"id":199641,"teacher_id":10372,"teacher_name":"陈飘飘","post_time":"2024-09-26 15:10:58","like_diff":-5,"likes":17,"dislikes":22,"content":"有幸跟着学习过几年，一位很纯粹的科研人。"},{"id":199642,"teacher_id":10372,"teacher_name":"陈飘飘","post_time":"2024-09-26 15:26:41","like_diff":-5,"likes":17,"dislikes":22,"content":"陈老师很好呀，身边有人在陈老师那边，经常跟我说陈老师行动力很强、很有想法、非常亲和、对学生很好等等，而且看过陈老师的照片，更觉得非常nice。"},{"id":199647,"teacher_id":10372,"teacher_name":"陈飘飘","post_time":"2024-09-26 23:54:52","like_diff":-6,"likes":17,"dislikes":23,"content":"飘飘老师的课程还没开，为什么就有人开始抹黑她了呢？作为一个和飘飘老师共事过的人，我觉得她不仅在工作中非常专业，而且为人亲切随和。她总是愿意耐心倾听别人的意见，和她相处时让人感到轻松自在。无论是教学还是与同事的合作，她都展现出极高的责任感和敬业精神，是一位好老师。"},{"id":204977,"teacher_id":10372,"teacher_name":"陈飘飘","post_time":"2024-11-29 06:38:40","like_diff":-6,"likes":7,"dislikes":13,"content":"讲得很好！"},{"id":198454,"teacher_id":10372,"teacher_name":"陈飘飘","post_time":"2024-09-09 04:30:59","like_diff":-7,"likes":28,"dislikes":35,"content":"你这么害人不浅，迟早会遭报应的。"},{"id":199653,"teacher_id":10372,"teacher_name":"陈飘飘","post_time":"2024-09-27 02:58:56","like_diff":-8,"likes":15,"dislikes":23,"content":"飘飘老师对科研非常认真负责，能力很强，日常也能和学生打成一片，很幸运能够来到陈老师课题组！"},{"id":219460,"teacher_id":10372,"teacher_name":"陈飘飘","post_time":"2025-05-28 01:21:49","like_diff":-9,"likes":4,"dislikes":13,"content":"看到楼下有说是博后期间的同事，我是飘飘博后期间实验室的研究生，相处了两年时间，为飘飘正名，飘飘为人正气和蔼，思路灵活，不可能做出任何差评所述内容。"},{"id":222096,"teacher_id":10372,"teacher_name":"陈飘飘","post_time":"2025-06-30 01:12:52","like_diff":-10,"likes":3,"dislikes":13,"content":"飘飘师姐在安娜堡期间实验室的博士生，飘飘人很好，大概率有的人看到飘飘的优秀破防了。所有提及博后期间的情况为不实消息，本人可实名证明，我为我说的话负责。"}];
                    
                    // 排序函数
                    function sortComments(sortType) {
                        let sortedComments = [...commentsData];
                        
                        if (sortType === 'popular') {
                            // 按人气排序（点赞减点踩）
                            sortedComments.sort((a, b) => b.like_diff - a.like_diff);
                        } else if (sortType === 'latest') {
                            // 按时间排序（最新在前）
                            sortedComments.sort((a, b) => new Date(b.post_time) - new Date(a.post_time));
                        }
                        
                        return sortedComments;
                    }
                    
                    // 渲染评论列表
                    function renderComments(comments) {
                        const commentsList = document.getElementById('comments-list');
                        commentsList.innerHTML = comments.map(comment => `
                            <div class="comment-item">
                                <div class="comment-meta">
                                    <span class="comment-time">${comment.post_time}</span>
                                    <span class="comment-likes">
                                        <span class="likes"><i class="fas fa-thumbs-up"></i> ${comment.likes}</span>
                                        <span class="dislikes"><i class="fas fa-thumbs-down"></i> ${comment.dislikes}</span>
                                    </span>
                                </div>
                                <div class="comment-content">${comment.content}</div>
                            </div>
                        `).join('');
                    }
                    
                    // 初始化页面
                    document.addEventListener('DOMContentLoaded', function() {
                        // 默认显示人气评论
                        renderComments(sortComments('popular'));
                        
                        // 绑定排序按钮事件
                        document.querySelectorAll('.sort-btn').forEach(btn => {
                            btn.addEventListener('click', function() {
                                // 更新按钮状态
                                document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
                                this.classList.add('active');
                                
                                // 排序并渲染评论
                                const sortType = this.getAttribute('data-sort');
                                renderComments(sortComments(sortType));
                            });
                        });
                    });
                </script>
            </div>
            
        
        <!-- 页脚 -->
        <footer class="footer">
            <p>浙江大学教评查询系统 | 数据时效: 2026-01-11</p>
        </footer>
    </div>
    
    <script>
        // 搜索功能
        document.addEventListener('DOMContentLoaded', function() {
            const searchInput = document.getElementById('search-input');
            const searchBtn = document.getElementById('search-btn');
            
            // 搜索按钮点击事件
            if (searchBtn) {
                searchBtn.addEventListener('click', function() {
                    performSearch();
                });
            }
            
            // 搜索框回车事件
            if (searchInput) {
                searchInput.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') {
                        performSearch();
                    }
                });
            }
            
            function performSearch() {
                const query = searchInput.value.trim();
                if (query) {
                    // 跳转到首页并携带搜索参数
                    window.location.href = '../index.html?search=' + encodeURIComponent(query);
                } else {
                    // 如果搜索为空，只跳转到首页
                    window.location.href = '../index.html';
                }
            }
        });
    </script>
