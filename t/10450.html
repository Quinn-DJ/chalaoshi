道非要全部进数字法学大家才满意吗？"},{"id":225688,"teacher_id":10450,"teacher_name":"邵敏杰","post_time":"2025-12-27 13:25:02","like_diff":1,"likes":2,"dislikes":1,"content":"虽然没上过邵老师的课吧，但相信张老师的为人，不至于拿个“耀祖”当大弟子。真心做学问的发论文少很正常，真正的学者会爱惜自己的羽毛，邵老师还年轻，想必发文少也是受了张老师价值观的影响。有些评论真的很搞笑，一股嫉妒的味道都要溢出屏幕了。"},{"id":222577,"teacher_id":10450,"teacher_name":"邵敏杰","post_time":"2025-07-14 02:56:17","like_diff":0,"likes":0,"dislikes":0,"content":"～～～～～"},{"id":222578,"teacher_id":10450,"teacher_name":"邵敏杰","post_time":"2025-07-14 03:17:01","like_diff":0,"likes":0,"dislikes":0,"content":"他做了什么"},{"id":223650,"teacher_id":10450,"teacher_name":"邵敏杰","post_time":"2025-10-10 06:27:46","like_diff":0,"likes":4,"dislikes":4,"content":"评论区的喷子真多，这么好的老师分这么低"},{"id":223766,"teacher_id":10450,"teacher_name":"邵敏杰","post_time":"2025-10-17 19:40:38","like_diff":0,"likes":3,"dislikes":3,"content":"那些说这个老师好的，请问一下教学好还是科研好，论教学没讲过课，论科研进校只有一篇C一篇C扩"},{"id":223921,"teacher_id":10450,"teacher_name":"邵敏杰","post_time":"2025-10-29 19:05:21","like_diff":0,"likes":3,"dislikes":3,"content":"教学能力（未体现）和论文能力较差。数字法学确实是热点，制了大量学术垃圾。但不意味着传统民商法发不出论文（难发不等于没有）。邵先生的学术能力几乎约等于法学院最低水准，可能还不如清北人政的民商法在读博士。"},{"id":224740,"teacher_id":10450,"teacher_name":"邵敏杰","post_time":"2025-11-29 17:11:05","like_diff":0,"likes":0,"dislikes":0,"content":"20251130"},{"id":224773,"teacher_id":10450,"teacher_name":"邵敏杰","post_time":"2025-12-21 15:22:16","like_diff":0,"likes":1,"dislikes":1,"content":"法学院进人越来越刷新下限，smj虽然拉胯，但是和cl相比，还是更懂一些法，修改为5分吧。\n\n-----------------------------\n\n法学院进人门槛最低的一次，看一次笑一次，和ws并列卧龙凤雏\n\n-------------------------\n\n冷知识，2017年的《交大法学》连C扩都不是，只是个普刊。真的看一次笑一次。"},{"id":224798,"teacher_id":10450,"teacher_name":"邵敏杰","post_time":"2025-12-03 15:28:12","like_diff":0,"likes":1,"dislikes":1,"content":"法学萧炎，本科拿江奖且是破纪录的高分，博一靠自己发了一篇交大法学，结果直博第七年也是这个成绩，不靠老师的关系还毕不了业。接下来看看能不能装逼打脸"},{"id":226023,"teacher_id":10450,"teacher_name":"邵敏杰","post_time":"2026-01-07 01:13:02","like_diff":-1,"likes":0,"dislikes":1,"content":"邵老师人很好啊，评论区戾气太重了吧…"},{"id":219491,"teacher_id":10450,"teacher_name":"邵敏杰","post_time":"2025-05-28 14:08:04","like_diff":-3,"likes":0,"dislikes":3,"content":"为啥没有上课评价，评分这么低啊，有没有人说道说道。ljh不也是导师保送也没人黑，好奇"},{"id":217545,"teacher_id":10450,"teacher_name":"邵敏杰","post_time":"2025-04-12 23:55:26","like_diff":-16,"likes":5,"dislikes":21,"content":"浙大本科，根正苗红，谷神开山博士。佛了几十年的谷神为他开始招博士（当年周翠老师也想招他为第一个博士，听说谷神要招立马作罢），在退休前亲自安排留校（据说谷神给学校的通牒是如果不能留他就走，显然是希望他做接班人）。作为非法大考生，初考江奖让法大感到危机，让那时刚刚加盟的朱庆育老师感到浙大本科还是有希望的，名次记录统治了整整十年，直到今年才被华政打破。邵老师很低调，低调到连自吹自擂的个人主页都没有，但这不代表不了解他为人的喷子能在这里匿名质疑为什么能留，攻击导师保送。就算导师保送又怎么样？他的导师是谷神，不是胡铭、王利明之流。"},{"id":212985,"teacher_id":10450,"teacher_name":"邵敏杰","post_time":"2025-01-15 12:08:11","like_diff":-18,"likes":6,"dislikes":24,"content":"能让谷神亲自带发论文，想必是极优秀的"},{"id":211827,"teacher_id":10450,"teacher_name":"邵敏杰","post_time":"2025-01-12 15:24:44","like_diff":-19,"likes":6,"dislikes":25,"content":"邵老师学术功底扎实，为人也真诚"},{"id":214016,"teacher_id":10450,"teacher_name":"邵敏杰","post_time":"2025-01-23 02:42:43","like_diff":-20,"likes":5,"dislikes":25,"content":"邵老师很好"},{"id":214019,"teacher_id":10450,"teacher_name":"邵敏杰","post_time":"2025-01-23 02:46:29","like_diff":-20,"likes":5,"dislikes":25,"content":"邵老师很好！"},{"id":216757,"teacher_id":10450,"teacher_name":"邵敏杰","post_time":"2025-03-24 06:11:08","like_diff":-20,"likes":1,"dislikes":21,"content":"评论区要求真高"},{"id":214017,"teacher_id":10450,"teacher_name":"邵敏杰","post_time":"2025-01-23 02:45:09","like_diff":-22,"likes":4,"dislikes":26,"content":"很好哦"}];
                    
                    // 排序函数

                            // 按时间排序（最新在前）
                            sortedComments.sort((a, b) => new Date(b.post_time) - new Date(a.post_time));
                        }
                        
                        return sortedComments;

                    // 渲染评论列表
                    function renderComments(comments) {

                    // 初始化页面

        <!-- 页脚 -->
        <footer class="footer">
            <p>浙江大学教评查询系统 | 数据时效: 2026-01-11</p>
        </footer>
    </div>
    
    <script>
        // 搜索功能
        document.addEventListener('DOMContentLoaded', function() {
            const searchInput = document.getElementById('search-input');
            const searchBtn = document.getElementById('search-btn');
            
            // 搜索按钮点击事件
            if (searchBtn) {
                searchBtn.addEventListener('click', function() {
                    performSearch();
                });
            }
            
            // 搜索框回车事件
            if (searchInput) {
                searchInput.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') {
                        performSearch();
                    }
                });
            }
            
            function performSearch() {
                const query = searchInput.value.trim();
                if (query) {
                    // 跳转到首页并携带搜索参数
                    window.location.href = '../index.html?search=' + encodeURIComponent(query);
                } else {
                    // 如果搜索为空，只跳转到首页
                    window.location.href = '../index.html';
                }
            }
        });
    </script>
</body>
</html>
