                align-items: flex-start;
                gap: 15px;
            }
            
            .comments-sort {

                justify-content: center;
            }
            
            .sort-btn {

                justify-content: center;

    </style>
</head>
<body>
    <div class="container">
        <!-- 导航栏 -->

        </nav>
        
        <!-- 搜索栏 -->

        </div>
        
        <!-- 课程信息 -->
        
            <div class="teacher-courses">

                    <div class="course-card">

                        </div>
                    </div>
                
                    <div class="course-card">
                        <div class="course-name">物理学实验Ⅲ</div>
                        <div class="course-stats">
                            <span class="gpa">GPA: 4.45</span>
                            <span class="students">选课: 36人</span>
                            <span class="std-dev">标准差: 0.56</span>
                        </div>
                    </div>
                
                </div>
            </div>
            
        
        <!-- 学生评论 -->
        
            <div class="teacher-comments">
                <div class="comments-header">
                    <h3><i class="fas fa-comments"></i> 学生评论 (15 条)</h3>
                    <div class="comments-sort">
                        <button class="sort-btn active" data-sort="popular">
                            <i class="fas fa-fire"></i> 人气评论
                        </button>
                        <button class="sort-btn" data-sort="latest">
                            <i class="fas fa-clock"></i> 最新评论
                        </button>
                    </div>
                </div>
                <div class="comments-list" id="comments-list">
                </div>
                <script>
                    // 评论数据
                    const commentsData = [{"id":26422,"teacher_id":1571,"teacher_name":"陈星","post_time":"2016-06-18 07:55:54","like_diff":7,"likes":8,"dislikes":1,"content":"陈星大法好"},{"id":32537,"teacher_id":1571,"teacher_name":"陈星","post_time":"2016-07-07 12:21:45","like_diff":5,"likes":5,"dislikes":0,"content":"虽然今年教得是有点乱的，但是给分还是良心的(比某zz的大化老师好多了)"},{"id":175816,"teacher_id":1571,"teacher_name":"陈星","post_time":"2023-06-26 23:51:48","like_diff":4,"likes":5,"dislikes":1,"content":"讲课特别温柔，也结合实际应用授课，给我们看一些光刻，通讯视频来增长见识，总的来说很好的老师\n\n但他是负责后半学期的，前半学期zhy的熏陶下，根本就没几个人有基础知识和兴趣来认真听讲，往往课上他和同学互动，懂的举手🙋，然后没几个举手，于是重新讲一遍\n\n另外一点是实验比较抽象，然后也没有指导，建议搜学长学姐的祖传代码"},{"id":138148,"teacher_id":1571,"teacher_name":"陈星","post_time":"2021-07-07 14:02:46","like_diff":3,"likes":4,"dislikes":1,"content":"md，期末40都及格了"},{"id":139021,"teacher_id":1571,"teacher_name":"陈星","post_time":"2021-07-12 08:12:21","like_diff":3,"likes":3,"dislikes":0,"content":"文雅随和，耐心，会重复讲直到大多数人都能听懂。美中不足是太无聊，不过这是微机这门课的问题，不能太怪老师"},{"id":174424,"teacher_id":1571,"teacher_name":"陈星","post_time":"2023-06-12 06:01:23","like_diff":2,"likes":3,"dislikes":1,"content":"实验没有指导"},{"id":112174,"teacher_id":1571,"teacher_name":"陈星","post_time":"2019-07-03 18:58:09","like_diff":1,"likes":2,"dislikes":1,"content":"微机，老师上课给人一种很儒雅随和的感觉。虽然讲课比较一般，对重点与非重点的把握不是很到位。"},{"id":117541,"teacher_id":1571,"teacher_name":"陈星","post_time":"2019-09-25 22:00:16","like_diff":1,"likes":1,"dislikes":0,"content":"挺帅的"},{"id":138158,"teacher_id":1571,"teacher_name":"陈星","post_time":"2021-07-07 14:52:10","like_diff":1,"likes":1,"dislikes":0,"content":"讲课确实很奇怪"},{"id":222668,"teacher_id":1571,"teacher_name":"陈星","post_time":"2025-07-31 06:38:43","like_diff":1,"likes":1,"dislikes":0,"content":"学微机的同学请不要选这个教学班，平时分绩杀，讲课也不如田翔"},{"id":32547,"teacher_id":1571,"teacher_name":"陈星","post_time":"2016-07-07 14:07:22","like_diff":0,"likes":1,"dislikes":1,"content":"讲的确实不行…"},{"id":196108,"teacher_id":1571,"teacher_name":"陈星","post_time":"2024-07-01 16:07:53","like_diff":0,"likes":0,"dislikes":0,"content":"陈星老师还是太温柔了😭欣然接受点名没到的同学千奇百怪的理由，讲课也特别儒雅听着特别舒服（尤其是和zhy对比），给期末一个第六大题拓展连芯片连错、第七大题程序只写了个软件流程图的人捞上了90😭\n\n\n\n如果微机原理单独开一门课，里面只有陈星老师一人讲完所有内容而不是和zhy老师搭档，那就非常不错，但如果有zhy老师负责前半部分的话，建议去另一个教学班旁听吧（tx/wyz等）"},{"id":198644,"teacher_id":1571,"teacher_name":"陈星","post_time":"2024-09-16 18:05:25","like_diff":0,"likes":0,"dislikes":0,"content":"你们传感的老师都这么喜欢让学生在研究生课上打工吗？"},{"id":204380,"teacher_id":1571,"teacher_name":"陈星","post_time":"2024-11-25 14:10:58","like_diff":0,"likes":0,"dislikes":0,"content":"信号处理那个研究生课，不点名，学生走了也不管，给分挺好的（93）"},{"id":222583,"teacher_id":1571,"teacher_name":"陈星","post_time":"2025-07-14 13:04:57","like_diff":0,"likes":0,"dislikes":0,"content":"有两次二维码点名\n\n平时分会绩杀，平时分比期末低，慎选"}];
                    
                    // 排序函数
                    function sortComments(sortType) {
                        let sortedComments = [...commentsData];
                        
                        if (sortType === 'popular') {
                            // 按人气排序（点赞减点踩）
                            sortedComments.sort((a, b) => b.like_diff - a.like_diff);
                        } else if (sortType === 'latest') {
                            // 按时间排序（最新在前）
                            sortedComments.sort((a, b) => new Date(b.post_time) - new Date(a.post_time));
                        }
                        
                        return sortedComments;
                    }
                    
                    // 渲染评论列表
                    function renderComments(comments) {
                        const commentsList = document.getElementById('comments-list');
                        commentsList.innerHTML = comments.map(comment => `
                            <div class="comment-item">
                                <div class="comment-meta">
                                    <span class="comment-time">${comment.post_time}</span>
                                    <span class="comment-likes">
                                        <span class="likes"><i class="fas fa-thumbs-up"></i> ${comment.likes}</span>
                                        <span class="dislikes"><i class="fas fa-thumbs-down"></i> ${comment.dislikes}</span>
                                    </span>
                                </div>
                                <div class="comment-content">${comment.content}</div>
                            </div>
                        `).join('');
                    }
                    
                    // 初始化页面
                    document.addEventListener('DOMContentLoaded', function() {
                        // 默认显示人气评论
                        renderComments(sortComments('popular'));
                        
                        // 绑定排序按钮事件
                        document.querySelectorAll('.sort-btn').forEach(btn => {
                            btn.addEventListener('click', function() {
                                // 更新按钮状态
                                document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
                                this.classList.add('active');
                                
                                // 排序并渲染评论
                                const sortType = this.getAttribute('data-sort');
                                renderComments(sortComments(sortType));
                            });
                        });
                    });
                </script>

        <!-- 页脚 -->

    <script>
        // 搜索功能
        document.addEventListener('DOMContentLoaded', function() {
            const searchInput = document.getElementById('search-input');
            const searchBtn = document.getElementById('search-btn');
            
            // 搜索按钮点击事件
            if (searchBtn) {
                searchBtn.addEventListener('click', function() {
                    performSearch();
                });
            }
            
            // 搜索框回车事件
            if (searchInput) {
                searchInput.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') {
                        performSearch();
                    }
                });
            }
            
            function performSearch() {
                const query = searchInput.value.trim();
                if (query) {
                    // 跳转到首页并携带搜索参数
                    window.location.href = '../index.html?search=' + encodeURIComponent(query);
                } else {
                    // 如果搜索为空，只跳转到首页
                    window.location.href = '../index.html';
                }
            }
        });
    </script>
</body>
</html>
