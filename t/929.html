课"},{"id":157051,"teacher_id":929,"teacher_name":"龚小谨","post_time":"2022-06-21 18:15:53","like_diff":0,"likes":0,"dislikes":0,"content":"不点名，很随和，态度好。事情少，提前下课，随便翘。可以留很多时间给自己自学巩固，期末给分不错，可以选。但是要注意，期末不再是mit题库了，要认真学。"},{"id":217249,"teacher_id":929,"teacher_name":"龚小谨","post_time":"2025-04-06 12:54:24","like_diff":0,"likes":2,"dislikes":2,"content":"讲的很渣。而且这学期开始点名了，而且是线下点名（必须到教室）"},{"id":57645,"teacher_id":929,"teacher_name":"龚小谨","post_time":"2017-07-11 12:43:36","like_diff":-1,"likes":2,"dislikes":3,"content":"事多分差\n\n\n\n"},{"id":109720,"teacher_id":929,"teacher_name":"龚小谨","post_time":"2019-06-19 00:57:47","like_diff":-3,"likes":3,"dislikes":6,"content":"老师超好，听老师的课是一种享受"},{"id":156835,"teacher_id":929,"teacher_name":"龚小谨","post_time":"2022-06-21 05:26:59","like_diff":-3,"likes":1,"dislikes":4,"content":"我不是大佬，也不是纯摆烂人，平时作业按时交，会的自己写了，不会的问问同学，实在不会的就放过。四次lab自己的水平做的一言难尽。虽然matlab代码都交了，但报告差一次。期末复习也因为场波和其他科目没有在信号上花太多时间，过了一遍课本+抄好A4纸就上去考了。\n\n期中70分，期末大概也差不多，把自己会的基本全写上去了，最终3.6那一档的最高分。感谢龚老师、张老师和两位助教一学期辛勤的付出。"},{"id":124610,"teacher_id":929,"teacher_name":"龚小谨","post_time":"2020-07-03 16:10:04","like_diff":-5,"likes":2,"dislikes":7,"content":"找到mit题库，轻松满🐔"}];

                    function renderComments(comments) {
                        const commentsList = document.getElementById('comments-list');
                        commentsList.innerHTML = comments.map(comment => `
                            <div class="comment-item">
                                <div class="comment-meta">
                                    <span class="comment-time">${comment.post_time}</span>
                                    <span class="comment-likes">
                                        <span class="likes"><i class="fas fa-thumbs-up"></i> ${comment.likes}</span>
                                        <span class="dislikes"><i class="fas fa-thumbs-down"></i> ${comment.dislikes}</span>
                                    </span>
                                </div>
                                <div class="comment-content">${comment.content}</div>
                            </div>
                        `).join('');
                    }
                    
                    // 初始化页面
                    document.addEventListener('DOMContentLoaded', function() {
                        // 默认显示人气评论
                        renderComments(sortComments('popular'));
                        
                        // 绑定排序按钮事件
                        document.querySelectorAll('.sort-btn').forEach(btn => {
                            btn.addEventListener('click', function() {
                                // 更新按钮状态
                                document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
                                this.classList.add('active');
                                
                                // 排序并渲染评论
                                const sortType = this.getAttribute('data-sort');
                                renderComments(sortComments(sortType));
                            });
                        });
                    });
                </script>
            </div>
            
        
        <!-- 页脚 -->
        <footer class="footer">
            <p>浙江大学教评查询系统 | 数据时效: 2026-01-11</p>
        </footer>
    </div>
    
    <script>
        // 搜索功能
        document.addEventListener('DOMContentLoaded', function() {
            const searchInput = document.getElementById('search-input');
            const searchBtn = document.getElementById('search-btn');
            
            // 搜索按钮点击事件
            if (searchBtn) {
                searchBtn.addEventListener('click', function() {
                    performSearch();
                });
            }
            
            // 搜索框回车事件
            if (searchInput) {
                searchInput.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') {
                        performSearch();
                    }
                });
            }
            
            function performSearch() {
                const query = searchInput.value.trim();
                if (query) {
                    // 跳转到首页并携带搜索参数
                    window.location.href = '../index.html?search=' + encodeURIComponent(query);
                } else {
                    // 如果搜索为空，只跳转到首页
                    window.location.href = '../index.html';
                }
            }
        });
    </script>
</body>
</html>
