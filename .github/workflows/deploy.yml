name: Deploy to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      main-only:
        description: '仅构建主页（不含教师单页）'
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    # 环境配置（如需 GitHub Pages 部署保护规则可启用）
    # environment:
    #   name: github-pages
    #   url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build website
        run: |
          uv sync
          if [ "${{ inputs.main-only }}" = "true" ]; then
            uv run python main.py build --main-only
          else
            uv run python main.py
          fi

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web
          publish_branch: gh-pages
          force_orphan: true
          commit_message: 'deploy: ${{ github.sha }}'
